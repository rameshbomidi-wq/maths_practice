px;border-width:2px;border-radius:8px}\n.sum.mul .cbox{min-width:26px;height:28px;font-size:18px}\n.ops button{font-size:17px!important}\n.langbar{display:flex;justify-content:flex-end;margin-bottom:8px}\n.ops{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}\n.ops button{border:3px solid #CFE0DA;background:#fff;border-radius:14px;padding:10px 6px;font-size:20px;font-weight:700;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px}\n.ops button span{font-family:'Baloo Tamma 2';font-size:34px;line-height:1;color:var(--board)}\n.ops button[aria-pressed=\"true\"]{border-color:var(--board);background:var(--board);color:var(--chalk)}\n.ops button[aria-pressed=\"true\"] span{color:var(--yellow)}\n@media print{.pq.sub .col{padding-top:18px}}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<!-- START -->\n<section id=\"sStart\" class=\"screen on\">\n  <div class=\"langbar\"><button class=\"iconb\" onclick=\"window.raayLang&&raayLang('en')\">🌐 English<\/button><\/div>\n  <div class=\"ops\" role=\"group\" aria-label=\"ఏ లెక్కలు?\">\n    <button id=\"opAdd\" aria-pressed=\"true\"><span>+<\/span>కూడికలు<\/button>\n    <button id=\"opSub\" aria-pressed=\"false\"><span>−<\/span>తీసివేతలు<\/button>\n    <button id=\"opMul\" aria-pressed=\"false\"><span>×<\/span>గుణకారం<\/button>\n    <button id=\"opDiv\" aria-pressed=\"false\"><span>÷<\/span>భాగహారం<\/button>\n    <button id=\"opNam\" aria-pressed=\"false\" class=\"wide\"><span>📝<\/span>పేర్లు రాయండి<\/button>\n  <\/div>\n  <div class=\"board\">\n    <div class=\"bigplus\">\n      <div class=\"sym\" id=\"bSym\" aria-hidden=\"true\">+<\/div>\n      <div>\n        <h1 id=\"bTitle\">కూడికలు<\/h1>\n        <p>ఒక అంకె నుండి మూడు అంకెల వరకు — సులువు నుండి కష్టం వరకు<\/p>\n      <\/div>\n    <\/div>\n    <div class=\"words\" id=\"bWords\"><\/div>\n    <p class=\"rule\" id=\"bRule\"><\/p>\n  <\/div>\n\n  <div class=\"card\">\n    <label class=\"lb\" for=\"stName\">విద్యార్థి పేరు<\/label>\n    <input type=\"text\" id=\"stName\" placeholder=\"ఉదా: శ్రావణి\" autocomplete=\"off\">\n    <div class=\"row2\">\n      <div>\n        <label class=\"lb\" for=\"stClass\">తరగతి<\/label>\n        <select id=\"stClass\"><option>1<\/option><option>2<\/option><option selected>3<\/option><option>4<\/option><option>5<\/option><\/select>\n      <\/div>\n      <div>\n        <label class=\"lb\" for=\"qCount\">లెక్కల సంఖ్య<\/label>\n        <select id=\"qCount\"><option>10<\/option><option selected>20<\/option><option>30<\/option><option>50<\/option><\/select>\n      <\/div>\n    <\/div>\n    <label class=\"lb\">స్థాయి ఎంచుకోండి<\/label>\n    <div class=\"levels\" id=\"levels\"><\/div>\n    <p class=\"err\" id=\"startErr\" role=\"alert\"><\/p>\n    <button class=\"btn main\" id=\"btnStart\">ప్రాక్టీస్ మొదలుపెట్టు<\/button>\n    <button class=\"btn alt\" id=\"btnSheet\">వర్క్‌షీట్ ప్రింట్ చేయి<\/button>\n  <\/div>\n\n  <div class=\"card\">\n    <h3 style=\"margin:0 0 6px\">ఇటీవలి ఫలితాలు<\/h3>\n    <ul class=\"hist\" id=\"histList\"><\/ul>\n    <button class=\"iconb\" id=\"btnClearHist\" style=\"margin-top:8px;display:none\">ఫలితాలు తొలగించు<\/button>\n  <\/div>\n<\/section>\n\n<!-- QUIZ -->\n<section id=\"sQuiz\" class=\"screen\">\n  <div class=\"qtop\">\n    <button class=\"iconb\" id=\"btnHome\" aria-label=\"హోమ్\">🏠<\/button>\n    <div class=\"who\" id=\"qWho\"><\/div>\n    <button class=\"iconb\" id=\"btnVoice\" aria-label=\"వాయిస్\">🔊<\/button>\n  <\/div>\n  <div class=\"bar\"><i id=\"qBar\"><\/i><\/div>\n  <div class=\"meta\"><span id=\"qNum\"><\/span><span id=\"qScore\"><\/span><\/div>\n  <div class=\"story\" id=\"story\" hidden><\/div>\n  <div class=\"qboard\">\n    <div class=\"qtag\" id=\"qTag\"><\/div>\n    <div class=\"sum\" id=\"sumGrid\"><\/div>\n    <button class=\"iconb say\" id=\"btnSay\">🔈 లెక్క చదువు<\/button>\n  <\/div>\n  <div class=\"fb\" id=\"fb\" aria-live=\"polite\"><\/div>\n  <div class=\"steps\" id=\"steps\"><\/div>\n  <div class=\"chips\" id=\"chips\" hidden><\/div>\n  <div class=\"pad\" id=\"pad\"><\/div>\n  <div class=\"acts\">\n    <button class=\"del\" id=\"btnDel\" aria-label=\"తుడుపు\">⌫<\/button>\n    <button class=\"hint\" id=\"btnHint\">సూచన<\/button>\n    <button class=\"chk\" id=\"btnCheck\">సరిచూడు<\/button>\n  <\/div>\n  <p class=\"muted\" id=\"orderNote\" style=\"text-align:center;margin-top:8px\"><\/p>\n<\/section>\n\n<!-- RESULT -->\n<section id=\"sRes\" class=\"screen\">\n  <div class=\"board res\">\n    <div id=\"rName\" class=\"disp\" style=\"font-size:26px;font-weight:700\"><\/div>\n    <div class=\"muted\" id=\"rInfo\" style=\"color:#CFE3DD\"><\/div>\n    <div class=\"score\" id=\"rScore\"><\/div>\n    <div class=\"stars\" id=\"rStars\"><\/div>\n    <div id=\"rMsg\" style=\"font-size:19px;font-weight:700\"><\/div>\n  <\/div>\n  <div class=\"card rev\" id=\"revCard\">\n    <h3 style=\"margin:0 0 6px\">మళ్ళీ చూడాల్సిన లెక్కలు<\/h3>\n    <div class=\"tw\"><table><thead><tr><th>లెక్క<\/th><th>రాసినది<\/th><th>సరైన జవాబు<\/th><\/tr><\/thead><tbody id=\"revBody\"><\/tbody><\/table><\/div>\n  <\/div>\n  <button class=\"btn main\" id=\"btnAgain\">మళ్ళీ కొత్త లెక్కలు<\/button>\n  <button class=\"btn alt\" id=\"btnPrintRes\">ఫలితం ప్రింట్ చేయి<\/button>\n  <button class=\"btn alt\" id=\"btnHome2\">హోమ్<\/button>\n<\/section>\n\n<footer>తయారీ: <b>రాయ్ ఎడ్యుకేషన్<\/b><\/footer>\n<\/div>\n<div id=\"modal\" class=\"modal\" hidden><div class=\"mbox\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"mMsg\"><p id=\"mMsg\"><\/p><div class=\"mbtns\"><button class=\"btn alt\" id=\"mNo\">వద్దు<\/button><button class=\"btn main\" id=\"mYes\">అవును<\/button><\/div><\/div><\/div>\n<div id=\"printArea\"><\/div>\n\n<script>\n(function(){\nconst $=id=>document.getElementById(id);\nconst PLACE=['ఒ','ప','వం','వే','ప.వే','ల','ప.ల','కో'];\nconst PLACEFULL=['ఒకట్లు','పదులు','వందలు','వేలు','పదివేలు','లక్షలు','పదిలక్షలు','కోట్లు'];\nconst OPS={\n '+':{sym:'+',title:'కూడికలు',word:'కూడిక',res:'మొత్తం',\n   words:['+ గుర్తు','సంకలనం','కలపడం','మొత్తం','Addition','Sum'],\n   lv:{1:['1) ఒక అంకె కూడికలు','3 + 4, 8 + 7 లాంటివి'],2:['2) రెండు అంకెల కూడికలు','తీసుకెళ్ళకుండా → తీసుకెళ్ళేవి (సులువు నుండి కష్టం)'],3:['3) మూడు అంకెల కూడికలు','తీసుకెళ్ళేవి కూడా'],4:['అన్నీ కలిపి','1, 2, 3 స్థాయిలు వరుసగా']}},\n '*':{sym:'×',title:'గుణకారం',word:'ఇంటూ',res:'లబ్ధం',rule:'ఒక దాని విలువ ఇచ్చి, ఎక్కువ వాటి విలువ అడిగితే → గుణకారం',\n   words:['× గుర్తు','గుణకారం','గుణించడం','గుణ్యం','గుణకం','లబ్ధం','Multiplication','Product'],\n   lv:{1:['1) 1 అంకెతో గుణకారం','2, 3, 4 అంకెల సంఖ్య × 1 అంకె'],2:['2) 2 అంకెలతో గుణకారం','2, 3, 4 అంకెల సంఖ్య × 2 అంకెలు'],3:['3) 3 అంకెలతో గుణకారం','2, 3, 4 అంకెల సంఖ్య × 3 అంకెలు'],4:['అన్నీ కలిపి','1, 2, 3 స్థాయిలు వరుసగా'],5:['కథా లెక్కలు','× చేయాలా? ÷ చేయాలా? ముందు ఎంచుకొని లెక్క చేయి']}},\n 'n':{sym:'📝',title:'పేర్లు',word:'',res:'సరైన పేర్లు',rule:'లెక్కలో ప్రతి సంఖ్యకు ఒక పేరు ఉంటుంది — గుర్తించి రాయండి',\n   words:['కూడే సంఖ్య','మొత్తం','తీసివేయబడే సంఖ్య','తీసివేసే సంఖ్య','తేడా','గుణ్యం','గుణకం','లబ్ధం','భాజ్యం','భాజకం','భాగఫలం','శేషం'],\n   lv:{1:['1) కూడిక, తీసివేత పేర్లు','48 + 36 = 84 → మొత్తం ...'],2:['2) గుణకారం, భాగహారం పేర్లు','36 × 4 = 144, 2 ) 4 ( 2'],3:['3) అన్నీ కలిపి','నాలుగు లెక్కల పేర్లు']}},\n '/':{sym:'÷',title:'భాగహారం',word:'భాగహారం',res:'భాగఫలం',rule:'ఎక్కువ వాటి విలువ ఇచ్చి, ఒక దాని విలువ అడిగితే → భాగహారం',\n   words:['÷ గుర్తు','భాగహారం','సమానంగా పంచుకోవడం','ఒక్కొక్కరికి ఎంత?','Divided by','భాజ్యం','భాజకం','భాగఫలం','శేషం','Division'],\n   lv:{1:['1) 2 అంకెలు ÷ 1 అంకె','24÷2, 25÷2, 52÷2, 55÷2 లాంటివి'],2:['2) 3 అంకెలు ÷ 1 అంకె','246÷2, 256÷2, శేషం, భాగఫలంలో 0'],3:['3) 4 అంకెలు ÷ 1 అంకె','పెద్ద సంఖ్యలు'],4:['అన్నీ కలిపి','1, 2, 3 స్థాయిలు వరుసగా'],5:['కథా లెక్కలు','× చేయాలా? ÷ చేయాలా? ముందు ఎంచుకొని లెక్క చేయి']}},\n '-':{sym:'−',title:'తీసివేతలు',word:'తీసివేత',res:'తేడా',\n   words:['− గుర్తు','తీసివేత','వ్యవకలనం','వ్యత్యాసం','తేడా','మిగిలినది','Subtraction','Difference'],\n   lv:{1:['1) ఒక అంకె తీసివేతలు','8 − 3, 15 − 7 లాంటివి'],2:['2) రెండు అంకెల తీసివేతలు','అప్పు లేకుండా → అప్పు తీసుకునేవి (సులువు నుండి కష్టం)'],3:['3) మూడు అంకెల తీసివేతలు','అప్పు, సున్నా నుండి అప్పు కూడా'],4:['అన్నీ కలిపి','1, 2, 3 స్థాయిలు వరుసగా']}}\n};\nconst lvName=(op,l)=>OPS[op||'+'].lv[l][0].replace(/^\\d\\)\\s*/,'')+(l==4?' ('+OPS[op||'+'].title+')':'');\nlet OP='+';\nlet S={name:'',cls:'',lvl:1,op:'+',qs:[],i:0,score:0,tries:0,done:false,wrong:[],voice:true,hintUsed:false,mark:false};\n\nfunction load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}\nfunction save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}\nconst r=(a,b)=>a+Math.floor(Math.random()*(b-a+1));\nconst rev=n=>String(n).split('').reverse().map(Number);\n\n/* ---------- addition generators ---------- */\nfunction carryCount(a,b){let c=0,k=0;while(a>0||b>0){const s=a%10+b%10+c;c=s>=10?1:0;k+=c;a=Math.floor(a/10);b=Math.floor(b/10)}return k}\nfunction g1(hard){let a,b;do{a=r(1,9);b=r(1,9)}while(hard?(a+b<10):(a+b>9));return [a,b]}\nfunction digitPair(carry,cin){let x,y;do{x=r(0,9);y=r(0,9)}while(carry?(x+y+cin<10):(x+y+cin>9));return [x,y]}\nfunction g2(carry){const o=digitPair(carry,0);let t;do{t=[r(1,9),r(1,9)]}while(t[0]+t[1]+(carry?1:0)>9);return [t[0]*10+o[0],t[1]*10+o[1]]}\nfunction g3(nc){const c1=nc>=1,c2=nc>=2;const o=digitPair(c1,0),t=digitPair(c2,c1?1:0);let h;do{h=[r(1,8),r(1,8)]}while(h[0]+h[1]+(c2?1:0)>9);return [h[0]*100+t[0]*10+o[0],h[1]*100+t[1]*10+o[1]]}\n\n/* ---------- subtraction: school borrow method simulation ---------- */\nfunction subSim(a,b){ // \"1 ముందు చేర్చి, కింది సంఖ్య పక్క స్థానంలో 1 కలిపే\" పద్ధతి\n  const ad=rev(a), bd=rev(b), W=ad.length, steps=[]; let pay=0, borrows=0, zero=false;\n  for(let p=0;p<W;p++){\n    const y=(bd[p]||0), ye=y+pay, st={p,x0:ad[p],y,pay,ye,borrow:false};\n    let x=ad[p];\n    if(x<ye){borrows++;st.borrow=true;if(ad[p]===0&&p>0)zero=true;x+=10}\n    st.x=x; st.d=x-ye; steps.push(st); pay=st.borrow?1:0;\n  }\n  return {steps,borrows,zero};\n}\nfunction s1(hard){let a,b;if(!hard){a=r(2,9);b=r(1,a)}else{do{a=r(11,18);b=r(2,9)}while(a%10>=b||a-b>9)}return [a,b]}\nfunction s2(borrow){let a,b,i;do{a=r(21,99);b=r(10,a-10);i=subSim(a,b)}while(i.borrows!==(borrow?1:0)||a-b<10);return [a,b]}\nfunction s3(kind){ // 0 none, 1 one borrow, 2 two borrows, 3 borrow across zero\n  let a,b,i,t=0;\n  do{t++;\n    a=kind===3?r(2,9)*100+r(0,8):r(200,999);\n    b=r(100,a-100); i=subSim(a,b);\n  }while(t<5000&&!(a-b>=100&&(kind===0?i.borrows===0:kind===1?(i.borrows===1&&!i.zero):kind===2?(i.borrows===2&&!i.zero):i.zero)));\n  return [a,b];\n}\n\nfunction build(op,lvl,n){\n  if(op==='n'){const ks=lvl==1?['+','-']:lvl==2?['*','/']:['+','-','*','/'];const out=[];for(let k=0;k<n;k++)out.push(nameQ(ks[k%ks.length]));return out}\n  if(lvl==5){const out=[];for(let k=0;k<n;k++)out.push(story(k,n));return out}\n  if(op==='/'){\n    const out=[],seen=new Set();\n    for(let k=0;k<n;k++){\n      let nd=lvl+1,part=k/n;\n      if(lvl==4){nd=part<1/3?2:part<2/3?3:4;part=(part*3)%1}\n      const nk=nd===4?4:5, kind=Math.min(nk-1,Math.floor(part*nk));\n      let q,t=0;do{q=dv(nd,kind);t++}while(seen.has(q.a+'/'+q.b)&&t<30);seen.add(q.a+'/'+q.b);out.push(q);\n    }\n    return out;\n  }\n  if(op==='*'){\n    const out=[],seen=new Set();\n    for(let k=0;k<n;k++){\n      let m=lvl,part=k/n;\n      if(lvl==4){m=part<1/3?1:part<2/3?2:3;part=(part*3)%1}\n      const nd=part<1/3?2:part<2/3?3:4;\n      let p,t=0;do{p=gm(nd,m);t++}while(seen.has(p.join('*'))&&t<40);seen.add(p.join('*'));\n      out.push({a:p[0],b:p[1],op,s:p[0]*p[1]});\n    }\n    return out;\n  }\n  const plan=[], add=op==='+';\n  const L1=h=>add?g1(h):s1(h), L2=h=>add?g2(h):s2(h);\n  const L3=(k,m)=>{ if(add){const x=k/m;return g3(x<.3?0:x<.65?1:2)} const x=k/m;return s3(x<.25?0:x<.55?1:x<.8?2:3)};\n  for(let k=0;k<n;k++){\n    if(lvl==1)plan.push(()=>L1(k>=Math.ceil(n/2)));\n    else if(lvl==2)plan.push(()=>L2(k>=Math.round(n*.4)));\n    else if(lvl==3)plan.push(()=>L3(k,n));\n    else{const a=Math.round(n/3),b=Math.round(2*n/3);\n      if(k<a)plan.push(()=>L1(k>=a/2));\n      else if(k<b)plan.push(()=>L2(k-a>=(b-a)/2));\n      else plan.push(()=>L3(k-b,n-b));}\n  }\n  const seen=new Set(),out=[];\n  plan.forEach(f=>{let p,t=0;do{p=f();t++}while(seen.has(p.join(op))&&t<40);seen.add(p.join(op));\n    out.push({a:p[0],b:p[1],op,s:add?p[0]+p[1]:p[0]-p[1]})});\n  return out;\n}\nfunction tagOf(q){\n  if(q.op==='n')return 'పేర్లు — '+OPS[q.kind].title;\n  if(q.story)return 'కథా లెక్క';\n  if(q.op==='/'){const P=divPlan(q.a,q.b),n=String(q.a).length;\n    return `${n} అంకెలు ÷ 1 అంకె — `+(P.firstSmall?'మొదటి అంకె చిన్నది':P.zeroQ?'భాగఫలంలో 0 వచ్చేది':P.carry?(P.rem?'మిగులుతో, శేషం ఉంది':'మిగులుతో'):(P.rem?'శేషం ఉంది':'సులువు'))}\n  if(q.op==='*'){const n=String(q.a).length,m=String(q.b).length;return `${n} అంకెలు × ${m} అంకె${m>1?'లు':''}`}\n  const d=String(q.a).length, dn=['','ఒక అంకె','రెండు అంకెలు','మూడు అంకెలు'][Math.min(d,3)];\n  if(q.op==='+'){\n    const c=carryCount(q.a,q.b);\n    if(Math.max(q.a,q.b)<10)return 'ఒక అంకె'+(q.s>9?' — మొత్తం 10 దాటేది':' — సులువు');\n    return dn+(c==0?' — తీసుకెళ్ళకుండా':c==1?' — ఒకసారి తీసుకెళ్ళేది':' — రెండుసార్లు తీసుకెళ్ళేది');\n  }\n  if(q.a<10)return 'ఒక అంకె — సులువు';\n  if(q.a<20&&q.b<10)return 'ఒక అంకె — 10 పైన సంఖ్య నుండి (అప్పు)';\n  const i=subSim(q.a,q.b);\n  return dn+(i.zero?' — సున్నా నుండి అప్పు':i.borrows==0?' — అప్పు లేకుండా':i.borrows==1?' — ఒకసారి అప్పు':' — రెండుసార్లు అప్పు');\n}\n\n/* ---------- multiplication (long multiplication) ---------- */\nfunction gm(n,m){const a=r(10**(n-1),10**n-1);let b=0;for(let i=0;i<m;i++)b=b*10+r(i===0&&m>1?1:2,9);return [a,b]}\nfunction mulPlan(q){ // slots in teaching order\n  const a=rev(q.a), bd=rev(q.b), m=bd.length, multi=m>1, L=String(q.s).length;\n  const exp={},order=[],stage={},steps=[];\n  const put=(k,v,s)=>{exp[k]=String(v);order.push(k);stage[k]=s};\n  const pk=(k,col)=>multi?'p'+k+'_'+col:'a'+col;\n  const partial=[];\n  for(let k=0;k<m;k++){\n    const d=bd[k], row=[], st={k,d,cols:[]};\n    for(let z=k-1;z>=0;z--){put(pk(k,z),0,k);row[z]=0}\n    let c=0;\n    for(let p=0;p<a.length;p++){\n      const prod=a[p]*d+c, last=p===a.length-1, col=p+k;\n      st.cols.push({x:a[p],c,prod,last});\n      if(last){const ds=String(prod);for(let i=0;i<ds.length;i++){const cc=col+ds.length-1-i;put(pk(k,cc),ds[i],k);row[cc]=+ds[i]}}\n      else{const cy=Math.floor(prod/10);if(cy>0)put('c'+k+'_'+(col+1),cy,k);put(pk(k,col),prod%10,k);row[col]=prod%10;c=cy}\n    }\n    partial.push(row);steps.push(st);\n  }\n  let addSt=null;\n  if(multi){\n    addSt=[];let c=0;\n    for(let col=0;col<L;col++){\n      const parts=partial.map(r=>r[col]).filter(v=>v!==undefined), tot=parts.reduce((x,y)=>x+y,0)+c;\n      addSt.push({col,parts,c,tot});\n      if(col===L-1){const ds=String(tot);for(let i=0;i<ds.length;i++)put('a'+(col+ds.length-1-i),ds[i],'add')}\n      else{const cy=Math.floor(tot/10);if(cy>0)put('d_'+(col+1),cy,'add');put('a'+col,tot%10,'add');c=cy}\n    }\n  }\n  return {exp,order,stage,steps,addSt,m,multi,partial};\n}\nfunction drawMul(){\n  const q=S.qs[S.i], P=S.mp, W=String(q.s).length, g=$('sumGrid');\n  g.classList.remove('sub');g.classList.add('mul');\n  g.style.gridTemplateColumns=`repeat(${W+1},auto)`;\n  const nk=nextPos(); let cur=nk!==null?P.stage[nk]:(P.multi?'add':0);\n  const cell=(inner,cls='')=>`<div class=\"cell${cls}\">${inner}<\/div>`;\n  let h=cell('',' place');for(let c=W-1;c>=0;c--)h+=cell(PLACE[c]||'',' place');\n  // carries of the multiplication row being worked on (earlier rows' carries are \"erased\")\n  h+=cell('',' crow');for(let c=W-1;c>=0;c--){const k='c'+cur+'_'+c;h+=cell(S.exp[k]?box(k,'cbox'):'',' crow')}\n  const num=(n,op)=>{let o=cell(op,' opc');const s=String(n).padStart(W,' ');for(const ch of s)o+=cell(ch.trim());return o};\n  h+=num(q.a,'')+num(q.b,'×');\n  h+=`<div class=\"line\" style=\"grid-column:1/-1\"><\/div>`;\n  const ansRow=(pre,op)=>{let o=cell(op,' opc');for(let c=W-1;c>=0;c--){const k=pre+c;o+=cell(S.exp[k]?box(k,'ans'):'')}return o};\n  if(P.multi){\n    h+=cell('',' crow');for(let c=W-1;c>=0;c--){const k='d_'+c;h+=cell(S.exp[k]&&(cur==='add')?box(k,'cbox'):'',' crow')}\n    for(let k=0;k<P.m;k++)h+=ansRow('p'+k+'_',k===P.m-1?'+':'');\n    h+=`<div class=\"line\" style=\"grid-column:1/-1\"><\/div>`;\n  }\n  h+=ansRow('a','');\n  g.innerHTML=h;\n}\nfunction mulSteps(q){\n  const P=mulPlan(q);let out='';\n  P.steps.forEach(st=>{\n    out+=`<p><b>${P.multi?PLACEFULL[st.k]+' అంకె ':''}${st.d} తో గుణించు${st.k?` (ముందు ${st.k} సున్నా${st.k>1?'లు':''} రాయి)`:''}:<\/b> `;\n    out+=st.cols.map(c=>`${c.x} × ${st.d}${c.c?' + '+c.c:''} = ${c.prod}`+(c.last?` → ${c.prod} రాయి`:c.prod>=10?` → ${Math.floor(c.prod/10)} పైన, ${c.prod%10} కింద`:` → ${c.prod}`)).join('; ')+'<\/p>';\n  });\n  if(P.addSt)out+=`<p><b>ఇప్పుడు వరుసలు కూడు:<\/b> `+P.addSt.map(s=>`${PLACEFULL[s.col]}: ${s.parts.join(' + ')}${s.c?' + '+s.c:''} = ${s.tot}`).join('; ')+'<\/p>';\n  return out;\n}\n\n/* ---------- division (long division: భాజకం ) భాజ్యం ( భాగఫలం) ---------- */\nfunction divPlan(a,d){\n  const D=String(a).split('').map(Number);let e=(D[0]<d&&D.length>1)?1:0;\n  let cur=+D.slice(0,e+1).join('');const steps=[];\n  while(true){\n    const qd=Math.floor(cur/d),prod=qd*d,rem=cur-prod,next=e+1<D.length?D[e+1]:null;\n    steps.push({e,cur,qd,prod,rem,next});\n    if(next===null)break;cur=rem*10+next;e++;\n  }\n  const exp={},order=[],stage={};\n  const put=(k,v,s)=>{exp[k]=String(v);order.push(k);stage[k]=s};\n  steps.forEach((st,s)=>{\n    put('q'+s,st.qd,s);\n    const ps=String(st.prod),start=st.e-ps.length+1;st.start=start;\n    for(let j=0;j<ps.length;j++)put('m'+s+'_'+(start+j),ps[j],s);\n    put('r'+s,st.rem,s);\n    if(st.next!==null)put('n'+s,st.next,s);\n  });\n  const quo=steps.map(s=>s.qd).join(''),rem=steps[steps.length-1].rem;\n  const carry=steps.slice(0,-1).some(s=>s.rem>0), zeroQ=steps.slice(1).some(s=>s.qd===0);\n  return {steps,exp,order,stage,quo:+quo,rem,carry,zeroQ,firstSmall:D[0]<d,D};\n}\nfunction dv(nd,kind){ // kinds listed per digit-count, easy → hard\n  let a,d,P,t=0;\n  const ok=()=>{\n    if(nd===2)return [!P.carry&&!P.rem&&!P.firstSmall, !P.carry&&P.rem&&!P.firstSmall, P.carry&&!P.rem&&!P.firstSmall, P.carry&&P.rem&&!P.firstSmall, P.firstSmall][kind];\n    if(nd===3)return [!P.carry&&!P.rem&&!P.firstSmall, P.carry&&!P.rem&&!P.zeroQ&&!P.firstSmall, P.rem&&!P.zeroQ&&!P.firstSmall, P.zeroQ&&!P.firstSmall, P.firstSmall][kind];\n    return [!P.rem&&!P.zeroQ&&!P.firstSmall, P.rem&&!P.zeroQ&&!P.firstSmall, P.zeroQ&&!P.firstSmall, P.firstSmall][kind];\n  };\n  do{t++;d=r(2,kind===0&&nd<4?4:9);a=r(10**(nd-1),10**nd-1);P=divPlan(a,d)}while(t<20000&&!ok());\n  return {a,b:d,op:'/',s:P.quo,rem:P.rem};\n}\n/* ---------- word problems: 1 → many = ×, many → 1 = ÷ ---------- */\nconst MUL_ST=[\n (p,n)=>`ఒక పెన్ను ధర ₹${p}. అలాంటి ${n} పెన్నుల ధర ఎంత?`,\n (p,n)=>`ఒక పెట్టెలో ${p} మామిడిపండ్లు ఉన్నాయి. ${n} పెట్టెల్లో మొత్తం ఎన్ని మామిడిపండ్లు?`,\n (p,n)=>`ఒక కిలో నిమ్మకాయల ధర ₹${p}. ${n} కిలోల నిమ్మకాయల ధర ఎంత?`,\n (p,n)=>`ఒక బస్సులో ${p} మంది ప్రయాణిస్తారు. ${n} బస్సుల్లో మొత్తం ఎంత మంది?`,\n (p,n)=>`ఒక నోటుపుస్తకంలో ${p} పేజీలు ఉన్నాయి. ${n} నోటుపుస్తకాల్లో ఎన్ని పేజీలు?`,\n (p,n)=>`ఒక చెట్టుకు ${p} కాయలు కాశాయి. ${n} చెట్లకు మొత్తం ఎన్ని కాయలు?`];\nconst DIV_ST=[\n (t,n)=>`${n} పెన్నుల ధర ₹${t}. ఒక పెన్ను ధర ఎంత?`,\n (t,n)=>`${t} చాక్లెట్లను ${n} మంది పిల్లలకు సమానంగా పంచితే ఒక్కొక్కరికి ఎన్ని?`,\n (t,n)=>`${n} కిలోల నిమ్మకాయల ధర ₹${t}. ఒక కిలో ధర ఎంత?`,\n (t,n)=>`${t} మామిడిపండ్లను ${n} పెట్టెల్లో సమానంగా సర్దితే ఒక్కో పెట్టెలో ఎన్ని?`,\n (t,n)=>`${n} నోటుపుస్తకాల్లో మొత్తం ${t} పేజీలు ఉన్నాయి. ఒక నోటుపుస్తకంలో ఎన్ని పేజీలు?`,\n (t,n)=>`${t} మంది విద్యార్థులను ${n} వరుసల్లో సమానంగా నిలబెడితే ఒక్కో వరుసలో ఎంత మంది?`];\nfunction story(k,n){\n  const hard=k>=n/2, p=hard?r(101,399):r(11,99), m=r(2,9), mul=Math.random()<.5;\n  if(mul)return {a:p,b:m,op:'*',s:p*m,story:MUL_ST[r(0,MUL_ST.length-1)](p,m)};\n  return {a:p*m,b:m,op:'/',s:p,rem:0,story:DIV_ST[r(0,DIV_ST.length-1)](p*m,m)};\n}\nfunction drawDiv(){\n  const q=S.qs[S.i],P=S.dp,D=P.D.length,Q=P.steps.length,cols=3+D+Q,g=$('sumGrid');\n  g.classList.remove('sub','mul');g.classList.add('div');\n  g.style.gridTemplateColumns=`repeat(${cols},auto)`;\n  const nk=nextPos(), cur=nk!==null?P.stage[nk]:Q-1;\n  const rows=[];const blank=()=>Array(cols).fill('');\n  const r0=blank();r0[0]=q.b;r0[1]=')';P.D.forEach((x,j)=>r0[2+j]=x);r0[2+D]='(';\n  for(let s=0;s<Q;s++)r0[3+D+s]=s<=cur?box('q'+s,'ans'):'';\n  rows.push([r0,'']);\n  P.steps.forEach((st,s)=>{\n    if(s>cur)return;\n    const last=s===Q-1, pr=blank(), ln=blank(), rr=blank();\n    pr[1+st.start]='−';\n    for(let c=st.start;c<=st.e;c++){pr[2+c]=box('m'+s+'_'+c,'ans');ln[2+c]='<div class=\"uln\"><\/div>'}\n    rr[2+st.e]=box('r'+s,'ans'+(last?' remb':''));\n    if(st.next!==null)rr[3+st.e]=box('n'+s,'ans dn');\n    if(last){rr[2+D]='<span class=\"remlbl\">శేషం<\/span>'}\n    rows.push([pr,''],[ln,' lrow'],[rr,'']);\n  });\n  g.innerHTML=rows.map(([cells,cls])=>cells.map((x,i)=>`<div class=\"cell${cls}${i===1||x==='−'?' opc':''}\">${x}<\/div>`).join('')).join('');\n}\nfunction divSteps(q){\n  const P=divPlan(q.a,q.b);\n  return P.steps.map(st=>`<p>${st.cur} లో ${q.b} ఎన్నిసార్లు? <b>${st.qd}<\/b> (${q.b} × ${st.qd} = ${st.prod}). ${st.cur} − ${st.prod} = ${st.rem}`+(st.next!==null?`. తర్వాతి అంకె ${st.next} కిందకు దించు.`:st.rem?`. మిగిలిన ${st.rem} శేషం.`:'.')+'<\/p>').join('');\n}\nconst ansTxt=q=>q.op==='n'?namesTxt(q):q.op==='/'&&q.rem?`${q.s} (శేషం ${q.rem})`:`${q.s}`;\nconst RULE={'*':'ఒక దాని విలువ ఇచ్చి, ఎక్కువ వాటి విలువ అడిగారు → గుణకారం (×)','/':'ఎక్కువ వాటి విలువ ఇచ్చి, ఒక దాని విలువ అడిగారు → భాగహారం (÷)'};\nfunction drawPick(){\n  const g=$('sumGrid');g.classList.remove('sub','mul','div');g.style.gridTemplateColumns='1fr 1fr';\n  g.innerHTML=`<p class=\"pickq\" style=\"grid-column:1/-1\">ఈ లెక్కకు ఏది చేయాలి?<\/p><button class=\"pick\" data-o=\"*\">× గుణకారం<\/button><button class=\"pick\" data-o=\"/\">÷ భాగహారం<\/button>`;\n  g.querySelectorAll('.pick').forEach(b=>b.onclick=()=>pickOp(b.dataset.o));\n}\nfunction pickOp(o){\n  const q=S.qs[S.i];\n  if(o===q.op){S.needOp=false;$('fb').className='fb ok';$('fb').textContent='✔ '+RULE[q.op];speak('సరైన ఎంపిక. '+RULE[q.op].replace(/\\(.\\)/,''));drawSum()}\n  else{S.opWrong=true;$('fb').className='fb no';$('fb').textContent='✘ '+RULE[q.op];speak('కాదు. '+RULE[q.op].replace(/\\(.\\)/,''))}\n}\n\n/* ---------- పేర్లు (names of the parts of each operation) ---------- */\nconst NAMES={'+':['కూడే సంఖ్య','కూడే సంఖ్య','మొత్తం'],'-':['తీసివేయబడే సంఖ్య','తీసివేసే సంఖ్య','తేడా'],'*':['గుణ్యం','గుణకం','లబ్ధం'],'/':['భాజకం','భాజ్యం','భాగఫలం','శేషం']};\nconst EN={'కూడే సంఖ్య':'Addend','మొత్తం':'Sum','తీసివేయబడే సంఖ్య':'Minuend','తీసివేసే సంఖ్య':'Subtrahend','తేడా':'Difference','గుణ్యం':'Multiplicand','గుణకం':'Multiplier','లబ్ధం':'Product','భాజ్యం':'Dividend','భాజకం':'Divisor','భాగఫలం':'Quotient','శేషం':'Remainder'};\nconst shuf=a=>{for(let i=a.length-1;i>0;i--){const j=r(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};\nfunction nameQ(kind){\n  let nums;\n  if(kind==='+'){const a=r(11,79),b=r(11,99-a);nums=[a,b,a+b]}\n  else if(kind==='-'){const a=r(30,99),b=r(11,a-10);nums=[a,b,a-b]}\n  else if(kind==='*'){let a,b;do{a=r(12,99);b=r(2,9)}while(a===b);nums=[a,b,a*b]}\n  else{let d,qt,rm,a;do{d=r(2,9);qt=r(2,20);rm=r(0,d-1);a=d*qt+rm}while(new Set([d,qt,rm,a]).size<4);nums=[d,a,qt,rm]}\n  const own=[...new Set(NAMES[kind])], other=shuf(Object.keys(NAMES).filter(k=>k!==kind).flatMap(k=>NAMES[k]).filter(x=>!own.includes(x)));\n  return {op:'n',kind,nums,a:nums[0],b:nums[1],s:1,chips:shuf([...own,...[...new Set(other)].slice(0,3)])};\n}\nconst qTxt=q=>q.op!=='n'?`${q.a} ${OPS[q.op].sym} ${q.b}`:q.kind==='/'?`${q.nums[1]} ÷ ${q.nums[0]} = ${q.nums[2]}, శేషం ${q.nums[3]}`:`${q.nums[0]} ${OPS[q.kind].sym} ${q.nums[1]} = ${q.nums[2]}`;\nconst namesTxt=q=>q.nums.map((n,i)=>`${n} → ${NAMES[q.kind][i]}`).join(', ');\nconst DPOS=['ఎడమ','మధ్య','కుడి','కింద'];\nfunction drawNames(){\n  const q=S.qs[S.i],g=$('sumGrid');\n  g.classList.remove('sub','mul','div');g.style.gridTemplateColumns='1fr';\n  const slot=i=>{const k='l'+i,v=S.vals[k],nx=!S.done&&k===nextPos(),st=S.mark?(v===S.exp[k]?' good':' bad'):'';\n    return `<button class=\"lslot${nx?' next':''}${st}\" data-k=\"${k}\">${v||'?'}<\/button>`};\n  let h='';\n  if(q.kind==='/'){\n    const [d,a,qt,rm]=q.nums;\n    h+=`<div class=\"dexp\"><span>${d}<\/span> ) <span>${a}<\/span> ( <span>${qt}<\/span><div class=\"drem\">${rm}<\/div><\/div>`;\n    q.nums.forEach((n,i)=>h+=`<div class=\"nrow\"><span class=\"nnum\">${n}<\/span><small class=\"npos\">(${DPOS[i]})<\/small><span class=\"arr\">→<\/span>${slot(i)}<\/div>`);\n  }else{\n    const ops=['',OPS[q.kind].sym,''];\n    q.nums.forEach((n,i)=>{ if(i===2)h+='<div class=\"nline\"><\/div>';\n      h+=`<div class=\"nrow\"><span class=\"nop\">${ops[i]}<\/span><span class=\"nnum\">${n}<\/span><span class=\"arr\">→<\/span>${slot(i)}<\/div>`});\n  }\n  g.innerHTML=h;\n  g.querySelectorAll('.lslot').forEach(b=>b.onclick=()=>{if(S.done)return;S.vals[b.dataset.k]=null;S.mark=false;drawSum()});\n  $('chips').innerHTML=q.chips.map(c=>`<button class=\"chip\" data-c=\"${c}\">${c}<small>${EN[c]}<\/small><\/button>`).join('');\n  $('chips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{\n    if(S.done)return;const k=nextPos();if(k===null)return;S.vals[k]=b.dataset.c;S.mark=false;$('fb').textContent='';drawSum()});\n}\n\n/* ---------- voice ---------- */\nlet teVoice=null;\nfunction pickVoice(){if(!('speechSynthesis'in window))return;const v=speechSynthesis.getVoices();teVoice=v.find(x=>/te(-|_)?IN/i.test(x.lang))||v.find(x=>/^te/i.test(x.lang))||null}\nif('speechSynthesis'in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}\nfunction speak(t){if(!S.voice||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='te-IN';if(teVoice)u.voice=teVoice;u.rate=.9;speechSynthesis.speak(u)}catch(e){}}\nconst sayQ=q=>q.op==='n'?`ఈ ${OPS[q.kind].title} లెక్కలో ప్రతి సంఖ్య పేరు ఎంచుకోండి`:q.story?q.story:q.op==='/'?`${q.a} ని ${q.b} తో భాగిస్తే ఎంత?`:`${q.a} ${OPS[q.op].word} ${q.b} ఎంత?`;\n\n/* ---------- start screen ---------- */\nfunction setOp(op){\n  OP=op; const o=OPS[op];\n  $('opAdd').setAttribute('aria-pressed',op==='+');$('opSub').setAttribute('aria-pressed',op==='-');$('opMul').setAttribute('aria-pressed',op==='*');$('opDiv').setAttribute('aria-pressed',op==='/');$('opNam').setAttribute('aria-pressed',op==='n');\n  $('bRule').textContent=o.rule?'గుర్తుంచుకో: '+o.rule:'';$('bRule').hidden=!o.rule;\n  $('bSym').textContent=o.sym;$('bTitle').textContent=o.title;\n  $('bWords').innerHTML=o.words.map(w=>`<span>${w}<\/span>`).join('');\n  const cur=document.querySelector('input[name=lvl]:checked');let v=cur?cur.value:'1';\n  if(!o.lv[v])v='1';\n  $('levels').innerHTML=Object.keys(o.lv).map(l=>`<label class=\"lv\"><input type=\"radio\" name=\"lvl\" value=\"${l}\"${l==v?' checked':''}><span><b>${o.lv[l][0]}<\/b><small>${o.lv[l][1]}<\/small><\/span><\/label>`).join('');\n  save('raay_koodika_op',op);\n}\n$('opAdd').onclick=()=>setOp('+');$('opSub').onclick=()=>setOp('-');$('opMul').onclick=()=>setOp('*');$('opDiv').onclick=()=>setOp('/');$('opNam').onclick=()=>setOp('n');\nfunction esc(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]))}\nfunction renderHist(){\n  const h=load('raay_koodika_hist',[]);const ul=$('histList');\n  if(!h.length){ul.innerHTML='<li class=\"muted\">ఇంకా ఫలితాలు లేవు. మొదటి ప్రాక్టీస్ మొదలుపెట్టండి.<\/li>';$('btnClearHist').style.display='none';return}\n  ul.innerHTML=h.slice(0,8).map(x=>`<li><span>${esc(x.name)} (${x.cls}వ) — ${lvName(x.op,x.lvl)}<\/span><b>${x.score}/${x.total}<\/b><\/li>`).join('');\n  $('btnClearHist').style.display='inline-block';\n}\nfunction readForm(){\n  const name=$('stName').value.trim();\n  if(!name){$('startErr').textContent='ముందుగా విద్యార్థి పేరు రాయండి.';$('stName').focus();return null}\n  $('startErr').textContent='';\n  save('raay_koodika_last',{name,cls:$('stClass').value});\n  return {name,cls:$('stClass').value,op:OP,lvl:+document.querySelector('input[name=lvl]:checked').value,n:+$('qCount').value};\n}\nfunction ask(msg,yes,no){$('mMsg').textContent=msg;$('modal').hidden=false;$('mYes').focus();\n  $('mYes').onclick=()=>{$('modal').hidden=true;yes&&yes()};$('mNo').onclick=()=>{$('modal').hidden=true;no&&no()}}\nfunction show(id){\n  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');window.scrollTo(0,0);\n  if(id!=='sStart'){try{if(!history.state||!history.state.inner)history.pushState({inner:1},'')}catch(e){}}\n}\nfunction goHome(){show('sStart');renderHist();try{if(history.state&&history.state.inner)history.back()}catch(e){}}\nwindow.addEventListener('popstate',()=>{\n  if($('sQuiz').classList.contains('on')){\n    try{history.pushState({inner:1},'')}catch(e){}\n    ask('ప్రాక్టీస్ ఆపి హోమ్‌కి వెళ్ళాలా?',goHome);\n  }else if($('sRes').classList.contains('on')){show('sStart');renderHist()}\n});\ndocument.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('modal').hidden)$('mNo').click()});\n$('btnStart').onclick=()=>{\n  const f=readForm();if(!f)return;\n  S={...S,name:f.name,cls:f.cls,lvl:f.lvl,op:f.op,qs:build(f.op,f.lvl,f.n),i:0,score:0,wrong:[]};\n  $('qWho').textContent=f.name; show('sQuiz'); showQ();\n};\n$('btnSheet').onclick=()=>{const f=readForm();if(!f)return;printSheet(f)};\n$('btnClearHist').onclick=()=>ask('అన్ని ఫలితాలు తొలగించాలా?',()=>{save('raay_koodika_hist',[]);renderHist()});\n\n/* ---------- quiz ----------\n slots: 'a'+p = answer digit of column p; 'b'+p+'_'+row = small box above column p\n (addition: carry; subtraction: new top value after borrowing, row 0 nearest the number) */\nfunction showQ(){\n  const q=S.qs[S.i];\n  S.tries=0;S.done=false;S.hintUsed=false;S.mark=false;\n  const L=String(q.s).length, sd=String(q.s).split('').reverse();\n  S.exp={};S.order=[];S.rows=0;\n  const pushA=p=>{if(p<L){S.exp['a'+p]=sd[p];S.order.push('a'+p)}};\n  let note='జవాబు ఒకట్ల స్థానం (కుడి వైపు) నుండి రాయండి';\n  S.mp=null;S.dp=null;S.needOp=!!q.story;S.opWrong=false;\n  $('pad').hidden=q.op==='n';$('chips').hidden=q.op!=='n';\n  if(q.op==='n'){q.nums.forEach((n,i)=>{S.exp['l'+i]=NAMES[q.kind][i];S.order.push('l'+i)});note='ప్రతి సంఖ్యకు కింది పేర్లలో సరైనది నొక్కండి. మార్చాలంటే ఆ గడిని నొక్కండి.'}\n  $('story').hidden=!q.story;$('story').textContent=q.story||'';\n  if(q.op==='n'){}else if(q.op==='/'){\n    const P=divPlan(q.a,q.b);S.dp=P;Object.assign(S.exp,P.exp);S.order=P.order.slice();\n    note='క్రమం: భాగఫలం అంకె → గుణించి కింద రాయి → తీసివేయి → తర్వాతి అంకె కిందకు దించు. చివర మిగిలేది శేషం.';\n  }else if(q.op==='*'){\n    const P=mulPlan(q);S.mp=P;Object.assign(S.exp,P.exp);S.order=P.order.slice();\n    note='గుణిస్తే 10 దాటితే: ముందు పదుల అంకె పై చిన్న గడిలో, తర్వాత ఒకట్ల అంకె కింద రాయండి.'+(P.multi?' రెండో వరుస నుండి ముందు 0 రాయండి, చివరగా వరుసలు కూడండి.':'');\n  }else if(q.op==='+'){\n    if(Math.max(q.a,q.b)<10){for(let p=L-1;p>=0;p--)pushA(p); if(L>1)note='ముందు పదుల స్థానం (ఎడమ), తర్వాత ఒకట్లు (కుడి) రాయండి'}\n    else{\n      const a=rev(q.a),b=rev(q.b);let c=0;\n      for(let p=0;p<L;p++){\n        const s=(a[p]||0)+(b[p]||0)+c;c=s>=10?1:0;\n        if(c&&p+1<L&&(a[p+1]!==undefined||b[p+1]!==undefined)){S.exp['b'+(p+1)+'_0']='1';S.order.push('b'+(p+1)+'_0');S.rows=1}\n        pushA(p);\n      }\n      if(S.rows)note='కూడిక 10 దాటితే: ముందు పదుల అంకె పై చిన్న గడిలో, తర్వాత ఒకట్ల అంకె కింద గడిలో రాయండి';\n    }\n  }else{\n    const sim=subSim(q.a,q.b);\n    sim.steps.forEach(st=>{\n      if(st.borrow){S.exp['t'+st.p]='1';S.order.push('t'+st.p);S.exp['u'+(st.p+1)]='1';S.order.push('u'+(st.p+1))}\n      pushA(st.p);\n    });\n    if(sim.borrows)note='పై అంకె చిన్నదైతే: ముందు ఆ అంకె ముందు 1, తర్వాత కింది సంఖ్యలో పక్క స్థానంలో 1 రాసి, తర్వాత జవాబు రాయండి';\n  }\n  S.vals={};S.order.forEach(k=>S.vals[k]=null);\n  $('orderNote').textContent=note;\n  $('qNum').textContent=`లెక్క ${S.i+1} / ${S.qs.length}`;\n  $('qScore').textContent=`సరైనవి: ${S.score}`;\n  $('qBar').style.width=(S.i/S.qs.length*100)+'%';\n  $('qTag').textContent=tagOf(q);\n  $('fb').textContent='';$('fb').className='fb';\n  $('steps').className='steps';$('steps').innerHTML='';\n  $('btnCheck').textContent='సరిచూడు';\n  drawSum(); speak(sayQ(q));\n}\nconst full=k=>S.vals[k]!==null&&(k[0]==='l'||S.vals[k].length>=S.exp[k].length);\nfunction nextPos(){const k=S.order.find(x=>!full(x));return k===undefined?null:k}\nfunction box(k,cls){\n  const v=S.vals[k], nx=!S.done&&k===nextPos();\n  const st=S.mark?(v===S.exp[k]?' good':' bad'):'';\n  let extra='';\n  if((k[0]==='t'||k[0]==='u')&&v!==null&&!S.mark)extra+=' filled';\n  return `<div class=\"${cls}${nx?' next':''}${st}${extra}\" data-k=\"${k}\">${v===null?'':v}<\/div>`;\n}\nfunction drawSum(){\n  if(S.needOp){drawPick();return}\n  if(S.qs[S.i].op==='n'){drawNames();return}\n  if(S.qs[S.i].op==='*'){drawMul();return}\n  if(S.qs[S.i].op==='/'){drawDiv();return}\n  $('sumGrid').classList.remove('mul','div');\n  const q=S.qs[S.i], L=String(q.s).length, W=Math.max(L,String(q.a).length,String(q.b).length);\n  const g=$('sumGrid');\n  g.style.gridTemplateColumns=`repeat(${W+1},auto)`;\n  let h='<div class=\"cell place\"><\/div>';\n  for(let c=W-1;c>=0;c--)h+=`<div class=\"cell place\">${PLACE[c]}<\/div>`;\n  for(let row=S.rows-1;row>=0;row--){\n    h+='<div class=\"cell crow\"><\/div>';\n    for(let c=W-1;c>=0;c--){const k='b'+c+'_'+row;h+=`<div class=\"cell crow\">${S.exp[k]?box(k,'cbox'):''}<\/div>`}\n  }\n  g.classList.toggle('sub',q.op==='-');\n  const numRow=(num,op,pre)=>{let o=`<div class=\"cell opc\">${op}<\/div>`;\n    [...String(num).padStart(W,' ')].forEach((ch,i)=>{const c=W-1-i,k=pre+c;o+=`<div class=\"cell\">${S.exp[k]?box(k,'mini'):''}<span class=\"dg\">${ch.trim()}<\/span><\/div>`});return o};\n  h+=numRow(q.a,'','t')+numRow(q.b,OPS[q.op].sym,'u');\n  h+=`<div class=\"line\" style=\"grid-column:1/-1\"><\/div><div class=\"cell\"><\/div>`;\n  for(let k=0;k<W-L;k++)h+='<div class=\"cell\"><\/div>';\n  for(let p=L-1;p>=0;p--)h+=`<div class=\"cell\">${box('a'+p,'ans')}<\/div>`;\n  g.innerHTML=h;\n}\nfunction markBoxes(){S.mark=true;drawSum()}\nfunction press(n){\n  if(S.done||S.needOp||S.qs[S.i].op==='n')return;const k=nextPos();if(k===null)return;\n  S.mark=false;S.vals[k]=(S.vals[k]||'')+n;$('fb').textContent='';drawSum();\n}\nfunction del(){\n  if(S.done)return;\n  for(let j=S.order.length-1;j>=0;j--){const k=S.order[j];if(S.vals[k]!==null){S.vals[k]=k[0]!=='l'&&S.vals[k].length>1?S.vals[k].slice(0,-1):null;break}}\n  S.mark=false;drawSum();\n}\nfunction stepsHTML(q){\n  let out='';\n  if(q.op==='n')return `<p>ఈ లెక్కలో వచ్చే పేర్లు: <b>${[...new Set(NAMES[q.kind])].join(', ')}<\/b><\/p><p class=\"tot\"><b>సరైన పేర్లు: ${namesTxt(q)}<\/b><\/p>`;\n  if(q.story)out=`<p><b>${RULE[q.op]}<\/b><\/p>`;\n  if(q.op==='/'){out+=divSteps(q)}\n  else if(q.op==='*'){out+=mulSteps(q)}\n  else if(q.op==='+'){\n    const a=rev(q.a),b=rev(q.b),W=Math.max(a.length,b.length);let c=0;\n    for(let p=0;p<W;p++){\n      const x=a[p]||0,y=b[p]||0,s=x+y+c;\n      let t=`<b>${PLACEFULL[p]}:<\/b> ${x} + ${y}${c?' + '+c+' (తెచ్చినది)':''} = ${s}`;\n      t+=(s>=10&&p<W-1)?` → ${Math.floor(s/10)} ని ${PLACEFULL[p+1]} పైన రాసి, ${s%10} కింద రాయి`:` → ${s} రాయి`;\n      out+=`<p>${t}<\/p>`;c=s>=10?1:0;\n    }\n  }else{\n    const sim=subSim(q.a,q.b), L=String(q.s).length;\n    sim.steps.forEach(st=>{\n      let t=`<b>${PLACEFULL[st.p]}:<\/b> `;\n      const ys=st.pay?`(${st.y} + 1)`:`${st.y}`;\n      if(st.borrow)t+=`${st.x0} − ${ys} కుదరదు. ${st.x0} ముందు 1 చేర్చు → ${st.x}. కింది సంఖ్యలో ${PLACEFULL[st.p+1]} స్థానంలో 1 రాయి. `;\n      t+=`${st.x} − ${ys} = ${st.d}`;\n      if(st.p>=L)t+=' (ముందు సున్నా రాయనవసరం లేదు)';\n      out+=`<p>${t}<\/p>`;\n    });\n  }\n  return out+`<p class=\"tot\"><b>${OPS[q.op].res} = ${ansTxt(q)}<\/b><\/p>`;\n}\nfunction check(){\n  if(S.done){next();return}\n  if(S.needOp){$('fb').className='fb no';$('fb').textContent='ముందు × లేదా ÷ ఎంచుకోండి';return}\n  if(S.order.some(k=>!full(k))){$('fb').className='fb no';$('fb').textContent='అన్ని గడులూ నింపండి';return}\n  const q=S.qs[S.i],L=String(q.s).length;\n  let gs='';\n  if(q.op==='/'){for(let s=0;s<S.dp.steps.length;s++)gs+=S.vals['q'+s]}else for(let p=L-1;p>=0;p--)gs+=S.vals['a'+p];\n  let got=+gs;const ansKey=q.op==='/'?'q':q.op==='n'?'l':'a';\n  if(q.op==='n')got=S.order.every(k=>S.vals[k]===S.exp[k])?q.s:-1;\n  const boxOk=S.order.every(k=>k[0]===ansKey||S.vals[k]===S.exp[k]);\n  S.tries++;\n  const nxt=S.i<S.qs.length-1?'తర్వాతి లెక్క':'ఫలితం చూడు';\n  if(got===q.s&&boxOk){\n    if(S.tries===1&&!S.hintUsed&&!S.opWrong)S.score++;\n    S.done=true;markBoxes();\n    const pr=['భలే!','చాలా బాగుంది!','శభాష్!','సరైన జవాబు!'][r(0,3)];\n    $('fb').className='fb ok';$('fb').textContent=q.op==='n'?`✔ ${pr} అన్ని పేర్లు సరైనవి`:`✔ ${pr} ${q.a} ${OPS[q.op].sym} ${q.b} = ${ansTxt(q)}`;\n    speak(q.op==='n'?`${pr} అన్ని పేర్లు సరైనవి`:`${pr} ${q.a} ${OPS[q.op].word} ${q.b} సమానం ${q.s}`+(q.rem?`, శేషం ${q.rem}`:''));\n    if(S.tries>1||S.hintUsed||S.opWrong)S.wrong.push({q,got:S.firstGot});\n    $('btnCheck').textContent=nxt;\n  }else if(S.tries===1){\n    S.firstGot=got;markBoxes();\n    const msg=got===q.s?(q.op==='/'?'✘ గుణించిన / తీసివేసిన / దించిన అంకెల్లో తప్పు ఉంది. ఇంకోసారి ప్రయత్నించు':q.op==='*'?'✘ పై/మధ్య గడుల్లో రాసిన అంకె సరికాదు. ఇంకోసారి ప్రయత్నించు':q.op==='+'?'✘ తీసుకెళ్ళిన అంకె సరికాదు. ఇంకోసారి ప్రయత్నించు':'✘ చిన్న గడుల్లో రాసిన 1 సరికాదు. ఇంకోసారి ప్రయత్నించు'):'✘ సరికాదు. ఇంకోసారి ప్రయత్నించు';\n    $('fb').className='fb no';$('fb').textContent=msg;speak(msg.replace('✘ ',''));\n    setTimeout(()=>{if(!S.done){S.order.forEach(k=>S.vals[k]=null);S.mark=false;drawSum()}},1200);\n  }else{\n    S.done=true;markBoxes();S.wrong.push({q,got:S.firstGot});\n    $('fb').className='fb no';$('fb').textContent=`సరైన జవాబు: ${ansTxt(q)}`;\n    $('steps').innerHTML=stepsHTML(q);$('steps').className='steps on';\n    speak(`సరైన జవాబు ${q.s}`);$('btnCheck').textContent=nxt;\n  }\n}\nfunction next(){S.i++;if(S.i>=S.qs.length)finish();else showQ()}\nfunction hint(){S.hintUsed=true;$('steps').innerHTML=stepsHTML(S.qs[S.i]).replace(/<p class=\"tot\">.*$/,'');$('steps').className='steps on'}\n\n(function(){const p=$('pad');for(const n of [1,2,3,4,5,6,7,8,9,0]){const b=document.createElement('button');b.textContent=n;b.onclick=()=>press(n);p.appendChild(b)}})();\n$('btnDel').onclick=del;$('btnCheck').onclick=check;$('btnHint').onclick=hint;\n$('btnSay').onclick=()=>{const v=S.voice;S.voice=true;speak(sayQ(S.qs[S.i]));S.voice=v};\n$('btnVoice').onclick=()=>{S.voice=!S.voice;$('btnVoice').textContent=S.voice?'🔊':'🔇';if(!S.voice&&'speechSynthesis'in window)speechSynthesis.cancel()};\n$('btnHome').onclick=()=>ask('ప్రాక్టీస్ ఆపి హోమ్‌కి వెళ్ళాలా?',goHome);\ndocument.addEventListener('keydown',e=>{\n  if(!$('sQuiz').classList.contains('on')||!$('modal').hidden)return;\n  if(/^[0-9]$/.test(e.key))press(e.key);\n  else if(e.key==='Backspace'){e.preventDefault();del()}\n  else if(e.key==='Enter'){e.preventDefault();check()}\n});\n\n/* ---------- result ---------- */\nfunction finish(){\n  const t=S.qs.length,sc=S.score,pc=Math.round(sc/t*100);\n  $('rName').textContent=S.name;\n  $('rInfo').textContent=`${S.cls}వ తరగతి — ${lvName(S.op,S.lvl)} — ${new Date().toLocaleDateString('en-IN')}`;\n  $('rScore').textContent=`${sc}/${t}`;\n  const st=pc>=90?5:pc>=75?4:pc>=60?3:pc>=40?2:1;\n  $('rStars').textContent='★'.repeat(st)+'☆'.repeat(5-st);\n  const msg=pc>=90?`అద్భుతం! నువ్వు ${OPS[S.op].title}లో నిపుణుడివి.`:pc>=75?'చాలా బాగుంది! ఇంకొంచెం సాధన చేయి.':pc>=50?'బాగుంది. తప్పులు మళ్ళీ చూసి నేర్చుకో.':'రోజూ సాధన చేస్తే తప్పకుండా వస్తుంది!';\n  $('rMsg').textContent=msg;\n  $('revCard').style.display=S.wrong.length?'block':'none';\n  $('revBody').innerHTML=S.wrong.map(w=>`<tr><td>${qTxt(w.q)}<\/td><td style=\"color:#C0392B\">${w.q.op==='n'?'తప్పు పేర్లు':w.got??'-'}<\/td><td style=\"color:#2E8B4E;font-weight:700\">${ansTxt(w.q)}<\/td><\/tr>`).join('');\n  const h=load('raay_koodika_hist',[]);h.unshift({name:S.name,cls:S.cls,op:S.op,lvl:S.lvl,score:sc,total:t,d:Date.now()});save('raay_koodika_hist',h.slice(0,50));\n  show('sRes');speak(`${S.name}, నీకు ${t} లో ${sc} మార్కులు వచ్చాయి. ${msg}`);\n}\n$('btnAgain').onclick=()=>{S.qs=build(S.op,S.lvl,S.qs.length);S.i=0;S.score=0;S.wrong=[];show('sQuiz');showQ()};\n$('btnHome2').onclick=goHome;\n$('btnPrintRes').onclick=()=>{\n  const rows=S.wrong.map(w=>`<tr><td>${qTxt(w.q)}<\/td><td>${w.q.op==='n'?'తప్పు పేర్లు':w.got??'-'}<\/td><td>${ansTxt(w.q)}<\/td><\/tr>`).join('');\n  $('printArea').innerHTML=`<div class=\"ph\"><h2>${OPS[S.op].title} — ఫలితం<\/h2><div class=\"fl\"><span>పేరు: <b>${esc(S.name)}<\/b><\/span><span>తరగతి: ${S.cls}<\/span><span>స్థాయి: ${lvName(S.op,S.lvl)}<\/span><span>తేదీ: ${new Date().toLocaleDateString('en-IN')}<\/span><\/div><\/div>\n  <p style=\"font-size:22px\">మార్కులు: <b>${S.score} / ${S.qs.length}<\/b> &nbsp; ${$('rStars').textContent}<\/p><p>${$('rMsg').textContent}<\/p>\n  ${rows?`<h3>తప్పు చేసినవి<\/h3><table border=\"1\" cellpadding=\"6\" style=\"border-collapse:collapse;min-width:60%\"><tr><th>లెక్క<\/th><th>రాసినది<\/th><th>సరైన జవాబు<\/th><\/tr>${rows}<\/table>`:''}\n  <div class=\"pft\">ఉపాధ్యాయుని సంతకం: ____________ &nbsp;&nbsp; | రాయ్ ఎడ్యుకేషన్<\/div>`;\n  window.print();\n};\n\n/* ---------- worksheet ---------- */\nfunction printSheet(f){\n  const qs=build(f.op,f.lvl,f.n),dt=new Date().toLocaleDateString('en-IN'),o=OPS[f.op];\n  const cell=(q,k,key)=>q.op==='n'?`<div class=\"pst\"><b>${k+1})<\/b> ${qTxt(q)}<br>${q.nums.map((n,i)=>`${n} → ${key?NAMES[q.kind][i]:'__________'}`).join(' &nbsp; ')}<\/div>`\n    :q.story?`<div class=\"pst\"><b>${k+1})<\/b> ${q.story}<br>${key?'జవాబు: '+q.a+' '+OPS[q.op].sym+' '+q.b+' = '+ansTxt(q):'చేయాల్సింది: ____ &nbsp; జవాబు: ________'}<\/div>`\n    :q.op==='/'?`<div class=\"pq\"><span class=\"n\">${k+1})<\/span><div class=\"dvp\">${q.b} ) ${q.a} ( ${key?ansTxt(q):'&nbsp;'.repeat(8)}<\/div><\/div>`\n    :`<div class=\"pq${f.op==='-'?' sub':''}\"><span class=\"n\">${k+1})<\/span><div class=\"col\"><div>${q.a}<\/div><div class=\"u\">${o.sym} ${q.b}<\/div><div class=\"bx\">${key?q.s:''}<\/div><\/div><\/div>`;\n  const head=`<div class=\"ph\"><h2>${o.title} — వర్క్‌షీట్ (${lvName(f.op,f.lvl)})<\/h2><div class=\"fl\"><span>పేరు: <b>${esc(f.name)}<\/b><\/span><span>తరగతి: ${f.cls}<\/span><span>తేదీ: ${dt}<\/span><span>మార్కులు: ____ / ${qs.length}<\/span><\/div><\/div>`;\n  $('printArea').innerHTML=head+`<p style=\"margin:0 0 10px\">కింది లెక్కలు ${f.lvl==5?'చదివి × లేదా ÷ ఎంచుకొని చేయండి':{'+':'కూడండి','-':'తీసివేయండి','*':'గుణించండి','/':'భాగించండి','n':'చూసి ప్రతి సంఖ్యకు పేరు రాయండి'}[f.op]}. (సులువు నుండి కష్టం వరకు)<\/p><div class=\"pgrid\">${qs.map((q,k)=>cell(q,k,false)).join('')}<\/div>\n  <div class=\"pft\">రాయ్ ఎడ్యుకేషన్<\/div>\n  <div class=\"pkey\"><div class=\"ph\"><h2>జవాబులు — ${esc(f.name)}<\/h2><\/div><div class=\"pgrid\">${qs.map((q,k)=>cell(q,k,true)).join('')}<\/div><\/div>`;\n  window.print();\n}\n\n/* init */\nconst last=load('raay_koodika_last',null);\nif(last){$('stName').value=last.name||'';if(last.cls)$('stClass').value=last.cls}\n{const o=load('raay_koodika_op','+');setOp(OPS[o]?o:'+')}\nrenderHist();\n})();\n\n<\/script>\n<\/body>\n<\/html>",en:"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Maths Practice | రాయ్ ఎడ్యుకేషన్<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@500;700;800&family=Noto+Sans+Telugu:wght@400;600;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --board:#1E4D5C; --board2:#173E4A; --chalk:#FFFDF4; --yellow:#F4C542;\n  --pink:#EC6F95; --green:#56B870; --ink:#22313A; --paper:#EEF5F2; --muted:#5F7680;\n  box-sizing:border-box;\n  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);\n}\n*,*::before,*::after{box-sizing:inherit}\nhtml,body{margin:0}\nbody{font-family:'Noto Sans Telugu','Baloo Tamma 2',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;line-height:1.55}\nh1,h2,h3,.disp{font-family:'Baloo Tamma 2','Noto Sans Telugu',sans-serif;line-height:1.2}\nbutton{font-family:inherit;cursor:pointer}\nbutton:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}\n.wrap{max-width:560px;margin:0 auto;padding:14px}\n.screen{display:none}.screen.on{display:block}\n\n/* start */\n.board{background:var(--board);color:var(--chalk);border-radius:18px;padding:18px 18px 16px;border:6px solid #8A5A3B;box-shadow:inset 0 0 40px rgba(0,0,0,.25)}\n.bigplus{display:flex;align-items:center;gap:14px}\n.bigplus .sym{font-family:'Baloo Tamma 2';font-size:84px;font-weight:800;color:var(--yellow);line-height:.8}\n.bigplus h1{margin:0;font-size:34px}\n.bigplus p{margin:2px 0 0;opacity:.85;font-size:15px}\n.words{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}\n.words span{border:2px dashed rgba(255,253,244,.55);border-radius:10px;padding:3px 10px;font-size:16px}\n.card{background:#fff;border-radius:14px;padding:16px;margin-top:14px;border:2px solid #D6E4DF}\nlabel.lb{display:block;font-weight:700;margin:10px 0 6px}\ninput[type=text],select{width:100%;font:inherit;font-size:18px;padding:10px 12px;border:2px solid #BFD3CC;border-radius:10px;background:#fff;color:var(--ink)}\n.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.levels{display:grid;gap:8px}\n.lv{display:flex;gap:10px;align-items:flex-start;border:2px solid #D6E4DF;border-radius:12px;padding:10px 12px;cursor:pointer;background:#fff}\n.lv input{margin-top:6px;accent-color:var(--board)}\n.lv b{display:block;font-size:17px}\n.lv small{color:var(--muted)}\n.lv:has(input:checked){border-color:var(--board);background:#E6F1EE}\n.btn{border:0;border-radius:12px;padding:13px 16px;font-size:18px;font-weight:700}\n.btn.main{background:var(--board);color:var(--chalk);width:100%;margin-top:14px}\n.btn.alt{background:#fff;color:var(--board);border:2px solid var(--board);width:100%;margin-top:10px}\n.err{color:#C0392B;font-weight:600;min-height:1.4em;margin:6px 0 0}\n.hist{margin:0;padding:0;list-style:none}\n.hist li{display:flex;justify-content:space-between;border-bottom:1px solid #E3ECE9;padding:6px 0;font-size:15px}\n.hist li:last-child{border:0}\n.muted{color:var(--muted);font-size:14px}\n\n/* quiz */\n.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px}\n.qtop .who{font-weight:700;font-size:17px}\n.iconb{background:#fff;border:2px solid #CFE0DA;border-radius:10px;padding:6px 10px;font-size:16px}\n.bar{height:10px;background:#D6E4DF;border-radius:6px;margin:10px 0;overflow:hidden}\n.bar i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}\n.meta{display:flex;justify-content:space-between;font-size:15px;color:var(--muted)}\n.rule{margin:12px 0 0;font-size:15px;background:rgba(244,197,66,.15);border-left:4px solid var(--yellow);padding:6px 10px;border-radius:6px}\n.story{background:#fff;border:2px solid #F0D68A;border-radius:14px;padding:12px 14px;margin-top:10px;font-size:19px;font-weight:600;line-height:1.6}\n.pickq{text-align:center;font-size:19px;margin:4px 0 6px}\n.pick{background:var(--chalk);color:var(--board);border:0;border-radius:12px;font-size:22px;font-weight:800;padding:14px 10px;margin:4px}\n.sum.div{gap:2px}\n.sum.div .cell{width:29px;height:40px;font-size:26px}\n.sum.div .cell.lrow{height:6px}\n.sum.div .ans{width:27px;height:36px;font-size:21px;border-width:2px;border-radius:7px}\n.sum.div .ans.dn{border-style:dashed}\n.sum.div .ans.remb{border-color:var(--pink)}\n.uln{height:3px;width:100%;background:var(--chalk);border-radius:2px}\n.remlbl{font-size:13px;color:var(--pink);white-space:nowrap}\n.ops .wide{grid-column:1/-1}\n.chips[hidden],.pad[hidden],.story[hidden],.rule[hidden]{display:none!important}\n.nrow{display:flex;align-items:center;gap:10px;justify-content:center;margin:6px 0}\n.nop{width:24px;text-align:right;font-family:'Baloo Tamma 2';font-size:34px;color:var(--yellow)}\n.nnum{min-width:74px;text-align:right;font-family:'Baloo Tamma 2';font-size:38px;font-weight:700}\n.npos{color:#CFE3DD;font-size:13px;width:44px}\n.arr{font-size:26px;color:var(--yellow)}\n.nline{height:3px;background:var(--chalk);width:130px;margin:4px auto 4px 96px;border-radius:2px}\n.lslot{min-width:150px;min-height:48px;border:3px dashed var(--chalk);border-radius:10px;background:rgba(255,255,255,.08);color:var(--yellow);font-size:17px;font-weight:700;padding:4px 8px}\n.lslot.next{border-style:solid;border-color:var(--yellow);box-shadow:0 0 0 3px rgba(244,197,66,.35)}\n.lslot.good{border:3px solid var(--green);color:#A8F0BC}.lslot.bad{border:3px solid var(--pink);color:var(--pink)}\n.dexp{font-family:'Baloo Tamma 2';font-size:40px;font-weight:700;text-align:center;margin-bottom:8px;line-height:1.1}\n.dexp span{color:var(--chalk)}.dexp .drem{font-size:32px;color:var(--pink)}\n.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;justify-content:center}\n.chip{background:#fff;border:2px solid #CFE0DA;border-radius:12px;padding:8px 12px;font-size:17px;font-weight:700;color:var(--ink);display:flex;flex-direction:column;align-items:center;line-height:1.3}\n.chip small{font-size:12px;color:var(--muted);font-weight:600}\n.chip:active{background:#E6F1EE}\n.qboard{overflow-x:auto;background:var(--board);color:var(--chalk);border-radius:18px;border:6px solid #8A5A3B;padding:16px 10px 18px;margin-top:10px;display:flex;flex-direction:column;align-items:center}\n.qtag{font-size:14px;background:rgba(255,253,244,.15);border-radius:8px;padding:2px 10px;margin-bottom:8px}\n.sum{display:grid;gap:4px;justify-content:center;font-family:'Baloo Tamma 2',sans-serif}\n.cell{width:54px;height:58px;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:700}\n.place{height:24px;font-size:14px;color:var(--yellow);font-family:'Noto Sans Telugu'}\n.opc{color:var(--yellow)}\n.line{height:4px;background:var(--chalk);border-radius:2px}\n.ans{width:50px;height:58px;border:3px solid var(--chalk);border-radius:10px;background:rgba(255,255,255,.08);font-size:40px;color:var(--yellow);display:flex;align-items:center;justify-content:center;margin:auto}\n.ans.next{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(244,197,66,.35)}\n.ans.bad{border-color:var(--pink);color:var(--pink)}\n.ans.good{border-color:var(--green);color:#A8F0BC}\n.crow{height:44px;width:54px}\n.cbox{width:34px;height:36px;border:2px dashed var(--yellow);border-radius:8px;font-size:24px;color:var(--yellow);display:flex;align-items:center;justify-content:center;margin:auto;background:rgba(244,197,66,.08)}\n.cbox.next{border-style:solid;box-shadow:0 0 0 3px rgba(244,197,66,.35)}\n.cbox.good{border-color:var(--green);color:#A8F0BC}.cbox.bad{border-color:var(--pink);color:var(--pink)}\n.say{margin-top:10px;font-size:18px}\n.fb{min-height:30px;text-align:center;font-weight:700;font-size:19px;margin:10px 0 4px}\n.fb.ok{color:#2E8B4E}.fb.no{color:#C0392B}\n.steps{background:#FFF8E1;border:2px solid #F0D68A;border-radius:12px;padding:10px 14px;font-size:16px;display:none}\n.steps.on{display:block}\n.steps p{margin:4px 0}\n.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}\n.pad button{background:#fff;border:2px solid #CFE0DA;border-radius:12px;font-size:28px;font-weight:700;padding:10px 0;font-family:'Baloo Tamma 2';color:var(--ink)}\n.pad button:active{background:#E6F1EE}\n.acts{display:grid;grid-template-columns:1fr 1fr 2fr;gap:8px;margin-top:8px}\n.acts .del{background:#FDE8EE;borde
