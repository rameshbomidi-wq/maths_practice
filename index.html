"qCount\"><option>10<\/option><option selected>20<\/option><option>30<\/option><option>50<\/option><\/select>\n      <\/div>\n    <\/div>\n    <label class=\"lb\">Choose a level<\/label>\n    <div class=\"levels\" id=\"levels\"><\/div>\n    <p class=\"err\" id=\"startErr\" role=\"alert\"><\/p>\n    <button class=\"btn main\" id=\"btnStart\">Start Practice<\/button>\n    <button class=\"btn alt\" id=\"btnSheet\">Print Worksheet<\/button>\n  <\/div>\n\n  <div class=\"card\">\n    <h3 style=\"margin:0 0 6px\">Recent Results<\/h3>\n    <ul class=\"hist\" id=\"histList\"><\/ul>\n    <button class=\"iconb\" id=\"btnClearHist\" style=\"margin-top:8px;display:none\">Clear results<\/button>\n  <\/div>\n<\/section>\n\n<!-- QUIZ -->\n<section id=\"sQuiz\" class=\"screen\">\n  <div class=\"qtop\">\n    <button class=\"iconb\" id=\"btnHome\" aria-label=\"Home\">🏠<\/button>\n    <div class=\"who\" id=\"qWho\"><\/div>\n    <button class=\"iconb\" id=\"btnVoice\" aria-label=\"Voice\">🔊<\/button>\n  <\/div>\n  <div class=\"bar\"><i id=\"qBar\"><\/i><\/div>\n  <div class=\"meta\"><span id=\"qNum\"><\/span><span id=\"qScore\"><\/span><\/div>\n  <div class=\"story\" id=\"story\" hidden><\/div>\n  <div class=\"qboard\">\n    <div class=\"qtag\" id=\"qTag\"><\/div>\n    <div class=\"sum\" id=\"sumGrid\"><\/div>\n    <button class=\"iconb say\" id=\"btnSay\">🔈 Read aloud<\/button>\n  <\/div>\n  <div class=\"fb\" id=\"fb\" aria-live=\"polite\"><\/div>\n  <div class=\"steps\" id=\"steps\"><\/div>\n  <div class=\"chips\" id=\"chips\" hidden><\/div>\n  <div class=\"pad\" id=\"pad\"><\/div>\n  <div class=\"acts\">\n    <button class=\"del\" id=\"btnDel\" aria-label=\"Erase\">⌫<\/button>\n    <button class=\"hint\" id=\"btnHint\">Hint<\/button>\n    <button class=\"chk\" id=\"btnCheck\">Check<\/button>\n  <\/div>\n  <p class=\"muted\" id=\"orderNote\" style=\"text-align:center;margin-top:8px\"><\/p>\n<\/section>\n\n<!-- RESULT -->\n<section id=\"sRes\" class=\"screen\">\n  <div class=\"board res\">\n    <div id=\"rName\" class=\"disp\" style=\"font-size:26px;font-weight:700\"><\/div>\n    <div class=\"muted\" id=\"rInfo\" style=\"color:#CFE3DD\"><\/div>\n    <div class=\"score\" id=\"rScore\"><\/div>\n    <div class=\"stars\" id=\"rStars\"><\/div>\n    <div id=\"rMsg\" style=\"font-size:19px;font-weight:700\"><\/div>\n  <\/div>\n  <div class=\"card rev\" id=\"revCard\">\n    <h3 style=\"margin:0 0 6px\">Sums to review<\/h3>\n    <div class=\"tw\"><table><thead><tr><th>Sum<\/th><th>Written<\/th><th>Correct answer<\/th><\/tr><\/thead><tbody id=\"revBody\"><\/tbody><\/table><\/div>\n  <\/div>\n  <button class=\"btn main\" id=\"btnAgain\">New sums again<\/button>\n  <button class=\"btn alt\" id=\"btnPrintRes\">Print result<\/button>\n  <button class=\"btn alt\" id=\"btnHome2\">Home<\/button>\n<\/section>\n\n<footer>Made by: <b>రాయ్ ఎడ్యుకేషన్<\/b><\/footer>\n<\/div>\n<div id=\"modal\" class=\"modal\" hidden><div class=\"mbox\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"mMsg\"><p id=\"mMsg\"><\/p><div class=\"mbtns\"><button class=\"btn alt\" id=\"mNo\">No<\/button><button class=\"btn main\" id=\"mYes\">Yes<\/button><\/div><\/div><\/div>\n<div id=\"printArea\"><\/div>\n\n<script>\n(function(){\nconst $=id=>document.getElementById(id);\nconst PLACE=['O','T','H','Th','TTh','L','TL','C'];\nconst PLACEFULL=['Ones','Tens','Hundreds','Thousands','Ten thousands','Lakhs','Ten lakhs','Crores'];\nconst OPS={\n '+':{sym:'+',title:'Addition',word:'plus',res:'Sum',\n   words:['+ sign','Addition','Adding','Sum','Total','Plus'],\n   lv:{1:['1) 1-digit addition','3 + 4, 8 + 7 type'],2:['2) 2-digit addition','without carry → with carry (easy to difficult)'],3:['3) 3-digit addition','with carry too'],4:['All mixed','Levels 1, 2, 3 in order']}},\n '*':{sym:'×',title:'Multiplication',word:'times',res:'Product',rule:'Value of ONE is given, value of MANY is asked → Multiply',\n   words:['× sign','Multiplication','Times','Multiplicand','Multiplier','Product'],\n   lv:{1:['1) Multiply by 1 digit','2, 3, 4-digit number × 1 digit'],2:['2) Multiply by 2 digits','2, 3, 4-digit number × 2 digits'],3:['3) Multiply by 3 digits','2, 3, 4-digit number × 3 digits'],4:['All mixed','Levels 1, 2, 3 in order'],5:['Word problems','× or ÷? Choose first, then solve']}},\n 'n':{sym:'📝',title:'Names',word:'',res:'Correct names',rule:'Every number in a sum has a name — find and write it',\n   words:['Addend','Sum','Minuend','Subtrahend','Difference','Multiplicand','Multiplier','Product','Dividend','Divisor','Quotient','Remainder'],\n   lv:{1:['1) Names in addition & subtraction','48 + 36 = 84 → Sum ...'],2:['2) Names in multiplication & division','36 × 4 = 144, 2 ) 4 ( 2'],3:['3) All mixed','Names in all four operations']}},\n '/':{sym:'÷',title:'Division',word:'divided by',res:'Quotient',rule:'Value of MANY is given, value of ONE is asked → Divide',\n   words:['÷ sign','Division','Sharing equally','How much for each?','Divided by','Dividend','Divisor','Quotient','Remainder'],\n   lv:{1:['1) 2 digits ÷ 1 digit','24÷2, 25÷2, 52÷2, 55÷2 type'],2:['2) 3 digits ÷ 1 digit','246÷2, 256÷2, remainder, 0 in quotient'],3:['3) 4 digits ÷ 1 digit','Big numbers'],4:['All mixed','Levels 1, 2, 3 in order'],5:['Word problems','× or ÷? Choose first, then solve']}},\n '-':{sym:'−',title:'Subtraction',word:'minus',res:'Difference',\n   words:['− sign','Subtraction','Taking away','Difference','Remaining','Minus'],\n   lv:{1:['1) 1-digit subtraction','8 − 3, 15 − 7 type'],2:['2) 2-digit subtraction','without borrowing → with borrowing (easy to difficult)'],3:['3) 3-digit subtraction','borrowing, borrowing across zero too'],4:['All mixed','Levels 1, 2, 3 in order']}}\n};\nconst lvName=(op,l)=>OPS[op||'+'].lv[l][0].replace(/^\\d\\)\\s*/,'')+(l==4?' ('+OPS[op||'+'].title+')':'');\nlet OP='+';\nlet S={name:'',cls:'',lvl:1,op:'+',qs:[],i:0,score:0,tries:0,done:false,wrong:[],voice:true,hintUsed:false,mark:false};\n\nfunction load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}\nfunction save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}\nconst r=(a,b)=>a+Math.floor(Math.random()*(b-a+1));\nconst rev=n=>String(n).split('').reverse().map(Number);\n\n/* ---------- addition generators ---------- */\nfunction carryCount(a,b){let c=0,k=0;while(a>0||b>0){const s=a%10+b%10+c;c=s>=10?1:0;k+=c;a=Math.floor(a/10);b=Math.floor(b/10)}return k}\nfunction g1(hard){let a,b;do{a=r(1,9);b=r(1,9)}while(hard?(a+b<10):(a+b>9));return [a,b]}\nfunction digitPair(carry,cin){let x,y;do{x=r(0,9);y=r(0,9)}while(carry?(x+y+cin<10):(x+y+cin>9));return [x,y]}\nfunction g2(carry){const o=digitPair(carry,0);let t;do{t=[r(1,9),r(1,9)]}while(t[0]+t[1]+(carry?1:0)>9);return [t[0]*10+o[0],t[1]*10+o[1]]}\nfunction g3(nc){const c1=nc>=1,c2=nc>=2;const o=digitPair(c1,0),t=digitPair(c2,c1?1:0);let h;do{h=[r(1,8),r(1,8)]}while(h[0]+h[1]+(c2?1:0)>9);return [h[0]*100+t[0]*10+o[0],h[1]*100+t[1]*10+o[1]]}\n\n/* ---------- subtraction: school borrow method simulation ---------- */\nfunction subSim(a,b){ // \"1 ముందు చేర్చి, కింది సంఖ్య పక్క స్థానంలో 1 కలిపే\" పద్ధతి\n  const ad=rev(a), bd=rev(b), W=ad.length, steps=[]; let pay=0, borrows=0, zero=false;\n  for(let p=0;p<W;p++){\n    const y=(bd[p]||0), ye=y+pay, st={p,x0:ad[p],y,pay,ye,borrow:false};\n    let x=ad[p];\n    if(x<ye){borrows++;st.borrow=true;if(ad[p]===0&&p>0)zero=true;x+=10}\n    st.x=x; st.d=x-ye; steps.push(st); pay=st.borrow?1:0;\n  }\n  return {steps,borrows,zero};\n}\nfunction s1(hard){let a,b;if(!hard){a=r(2,9);b=r(1,a)}else{do{a=r(11,18);b=r(2,9)}while(a%10>=b||a-b>9)}return [a,b]}\nfunction s2(borrow){let a,b,i;do{a=r(21,99);b=r(10,a-10);i=subSim(a,b)}while(i.borrows!==(borrow?1:0)||a-b<10);return [a,b]}\nfunction s3(kind){ // 0 none, 1 one borrow, 2 two borrows, 3 borrow across zero\n  let a,b,i,t=0;\n  do{t++;\n    a=kind===3?r(2,9)*100+r(0,8):r(200,999);\n    b=r(100,a-100); i=subSim(a,b);\n  }while(t<5000&&!(a-b>=100&&(kind===0?i.borrows===0:kind===1?(i.borrows===1&&!i.zero):kind===2?(i.borrows===2&&!i.zero):i.zero)));\n  return [a,b];\n}\n\nfunction build(op,lvl,n){\n  if(op==='n'){const ks=lvl==1?['+','-']:lvl==2?['*','/']:['+','-','*','/'];const out=[];for(let k=0;k<n;k++)out.push(nameQ(ks[k%ks.length]));return out}\n  if(lvl==5){const out=[];for(let k=0;k<n;k++)out.push(story(k,n));return out}\n  if(op==='/'){\n    const out=[],seen=new Set();\n    for(let k=0;k<n;k++){\n      let nd=lvl+1,part=k/n;\n      if(lvl==4){nd=part<1/3?2:part<2/3?3:4;part=(part*3)%1}\n      const nk=nd===4?4:5, kind=Math.min(nk-1,Math.floor(part*nk));\n      let q,t=0;do{q=dv(nd,kind);t++}while(seen.has(q.a+'/'+q.b)&&t<30);seen.add(q.a+'/'+q.b);out.push(q);\n    }\n    return out;\n  }\n  if(op==='*'){\n    const out=[],seen=new Set();\n    for(let k=0;k<n;k++){\n      let m=lvl,part=k/n;\n      if(lvl==4){m=part<1/3?1:part<2/3?2:3;part=(part*3)%1}\n      const nd=part<1/3?2:part<2/3?3:4;\n      let p,t=0;do{p=gm(nd,m);t++}while(seen.has(p.join('*'))&&t<40);seen.add(p.join('*'));\n      out.push({a:p[0],b:p[1],op,s:p[0]*p[1]});\n    }\n    return out;\n  }\n  const plan=[], add=op==='+';\n  const L1=h=>add?g1(h):s1(h), L2=h=>add?g2(h):s2(h);\n  const L3=(k,m)=>{ if(add){const x=k/m;return g3(x<.3?0:x<.65?1:2)} const x=k/m;return s3(x<.25?0:x<.55?1:x<.8?2:3)};\n  for(let k=0;k<n;k++){\n    if(lvl==1)plan.push(()=>L1(k>=Math.ceil(n/2)));\n    else if(lvl==2)plan.push(()=>L2(k>=Math.round(n*.4)));\n    else if(lvl==3)plan.push(()=>L3(k,n));\n    else{const a=Math.round(n/3),b=Math.round(2*n/3);\n      if(k<a)plan.push(()=>L1(k>=a/2));\n      else if(k<b)plan.push(()=>L2(k-a>=(b-a)/2));\n      else plan.push(()=>L3(k-b,n-b));}\n  }\n  const seen=new Set(),out=[];\n  plan.forEach(f=>{let p,t=0;do{p=f();t++}while(seen.has(p.join(op))&&t<40);seen.add(p.join(op));\n    out.push({a:p[0],b:p[1],op,s:add?p[0]+p[1]:p[0]-p[1]})});\n  return out;\n}\nfunction tagOf(q){\n  if(q.op==='n')return 'Names — '+OPS[q.kind].title;\n  if(q.story)return 'Word problem';\n  if(q.op==='/'){const P=divPlan(q.a,q.b),n=String(q.a).length;\n    return `${n} digits ÷ 1 digit — `+(P.firstSmall?'first digit is smaller':P.zeroQ?'0 in the quotient':P.carry?(P.rem?'with carry-over, has remainder':'with carry-over'):(P.rem?'has remainder':'easy'))}\n  if(q.op==='*'){const n=String(q.a).length,m=String(q.b).length;return `${n} digits × ${m} digit${m>1?'s':''}`}\n  const d=String(q.a).length, dn=['','1 digit','2 digits','3 digits'][Math.min(d,3)];\n  if(q.op==='+'){\n    const c=carryCount(q.a,q.b);\n    if(Math.max(q.a,q.b)<10)return '1 digit'+(q.s>9?' — sum is 10 or more':' — easy');\n    return dn+(c==0?' — without carry':c==1?' — carry once':' — carry twice');\n  }\n  if(q.a<10)return '1 digit — easy';\n  if(q.a<20&&q.b<10)return '1 digit — from a number above 10 (borrow)';\n  const i=subSim(q.a,q.b);\n  return dn+(i.zero?' — borrowing across zero':i.borrows==0?' — without borrowing':i.borrows==1?' — borrow once':' — borrow twice');\n}\n\n/* ---------- multiplication (long multiplication) ---------- */\nfunction gm(n,m){const a=r(10**(n-1),10**n-1);let b=0;for(let i=0;i<m;i++)b=b*10+r(i===0&&m>1?1:2,9);return [a,b]}\nfunction mulPlan(q){ // slots in teaching order\n  const a=rev(q.a), bd=rev(q.b), m=bd.length, multi=m>1, L=String(q.s).length;\n  const exp={},order=[],stage={},steps=[];\n  const put=(k,v,s)=>{exp[k]=String(v);order.push(k);stage[k]=s};\n  const pk=(k,col)=>multi?'p'+k+'_'+col:'a'+col;\n  const partial=[];\n  for(let k=0;k<m;k++){\n    const d=bd[k], row=[], st={k,d,cols:[]};\n    for(let z=k-1;z>=0;z--){put(pk(k,z),0,k);row[z]=0}\n    let c=0;\n    for(let p=0;p<a.length;p++){\n      const prod=a[p]*d+c, last=p===a.length-1, col=p+k;\n      st.cols.push({x:a[p],c,prod,last});\n      if(last){const ds=String(prod);for(let i=0;i<ds.length;i++){const cc=col+ds.length-1-i;put(pk(k,cc),ds[i],k);row[cc]=+ds[i]}}\n      else{const cy=Math.floor(prod/10);if(cy>0)put('c'+k+'_'+(col+1),cy,k);put(pk(k,col),prod%10,k);row[col]=prod%10;c=cy}\n    }\n    partial.push(row);steps.push(st);\n  }\n  let addSt=null;\n  if(multi){\n    addSt=[];let c=0;\n    for(let col=0;col<L;col++){\n      const parts=partial.map(r=>r[col]).filter(v=>v!==undefined), tot=parts.reduce((x,y)=>x+y,0)+c;\n      addSt.push({col,parts,c,tot});\n      if(col===L-1){const ds=String(tot);for(let i=0;i<ds.length;i++)put('a'+(col+ds.length-1-i),ds[i],'add')}\n      else{const cy=Math.floor(tot/10);if(cy>0)put('d_'+(col+1),cy,'add');put('a'+col,tot%10,'add');c=cy}\n    }\n  }\n  return {exp,order,stage,steps,addSt,m,multi,partial};\n}\nfunction drawMul(){\n  const q=S.qs[S.i], P=S.mp, W=String(q.s).length, g=$('sumGrid');\n  g.classList.remove('sub');g.classList.add('mul');\n  g.style.gridTemplateColumns=`repeat(${W+1},auto)`;\n  const nk=nextPos(); let cur=nk!==null?P.stage[nk]:(P.multi?'add':0);\n  const cell=(inner,cls='')=>`<div class=\"cell${cls}\">${inner}<\/div>`;\n  let h=cell('',' place');for(let c=W-1;c>=0;c--)h+=cell(PLACE[c]||'',' place');\n  // carries of the multiplication row being worked on (earlier rows' carries are \"erased\")\n  h+=cell('',' crow');for(let c=W-1;c>=0;c--){const k='c'+cur+'_'+c;h+=cell(S.exp[k]?box(k,'cbox'):'',' crow')}\n  const num=(n,op)=>{let o=cell(op,' opc');const s=String(n).padStart(W,' ');for(const ch of s)o+=cell(ch.trim());return o};\n  h+=num(q.a,'')+num(q.b,'×');\n  h+=`<div class=\"line\" style=\"grid-column:1/-1\"><\/div>`;\n  const ansRow=(pre,op)=>{let o=cell(op,' opc');for(let c=W-1;c>=0;c--){const k=pre+c;o+=cell(S.exp[k]?box(k,'ans'):'')}return o};\n  if(P.multi){\n    h+=cell('',' crow');for(let c=W-1;c>=0;c--){const k='d_'+c;h+=cell(S.exp[k]&&(cur==='add')?box(k,'cbox'):'',' crow')}\n    for(let k=0;k<P.m;k++)h+=ansRow('p'+k+'_',k===P.m-1?'+':'');\n    h+=`<div class=\"line\" style=\"grid-column:1/-1\"><\/div>`;\n  }\n  h+=ansRow('a','');\n  g.innerHTML=h;\n}\nfunction mulSteps(q){\n  const P=mulPlan(q);let out='';\n  P.steps.forEach(st=>{\n    out+=`<p><b>Multiply by ${P.multi?PLACEFULL[st.k]+' digit ':''}${st.d}${st.k?` (first write ${st.k} zero${st.k>1?'s':''})`:''}:<\/b> `;\n    out+=st.cols.map(c=>`${c.x} × ${st.d}${c.c?' + '+c.c:''} = ${c.prod}`+(c.last?` → write ${c.prod}`:c.prod>=10?` → ${Math.floor(c.prod/10)} above, ${c.prod%10} below`:` → ${c.prod}`)).join('; ')+'<\/p>';\n  });\n  if(P.addSt)out+=`<p><b>Now add the rows:<\/b> `+P.addSt.map(s=>`${PLACEFULL[s.col]}: ${s.parts.join(' + ')}${s.c?' + '+s.c:''} = ${s.tot}`).join('; ')+'<\/p>';\n  return out;\n}\n\n/* ---------- division (long division: భాజకం ) భాజ్యం ( భాగఫలం) ---------- */\nfunction divPlan(a,d){\n  const D=String(a).split('').map(Number);let e=(D[0]<d&&D.length>1)?1:0;\n  let cur=+D.slice(0,e+1).join('');const steps=[];\n  while(true){\n    const qd=Math.floor(cur/d),prod=qd*d,rem=cur-prod,next=e+1<D.length?D[e+1]:null;\n    steps.push({e,cur,qd,prod,rem,next});\n    if(next===null)break;cur=rem*10+next;e++;\n  }\n  const exp={},order=[],stage={};\n  const put=(k,v,s)=>{exp[k]=String(v);order.push(k);stage[k]=s};\n  steps.forEach((st,s)=>{\n    put('q'+s,st.qd,s);\n    const ps=String(st.prod),start=st.e-ps.length+1;st.start=start;\n    for(let j=0;j<ps.length;j++)put('m'+s+'_'+(start+j),ps[j],s);\n    put('r'+s,st.rem,s);\n    if(st.next!==null)put('n'+s,st.next,s);\n  });\n  const quo=steps.map(s=>s.qd).join(''),rem=steps[steps.length-1].rem;\n  const carry=steps.slice(0,-1).some(s=>s.rem>0), zeroQ=steps.slice(1).some(s=>s.qd===0);\n  return {steps,exp,order,stage,quo:+quo,rem,carry,zeroQ,firstSmall:D[0]<d,D};\n}\nfunction dv(nd,kind){ // kinds listed per digit-count, easy → hard\n  let a,d,P,t=0;\n  const ok=()=>{\n    if(nd===2)return [!P.carry&&!P.rem&&!P.firstSmall, !P.carry&&P.rem&&!P.firstSmall, P.carry&&!P.rem&&!P.firstSmall, P.carry&&P.rem&&!P.firstSmall, P.firstSmall][kind];\n    if(nd===3)return [!P.carry&&!P.rem&&!P.firstSmall, P.carry&&!P.rem&&!P.zeroQ&&!P.firstSmall, P.rem&&!P.zeroQ&&!P.firstSmall, P.zeroQ&&!P.firstSmall, P.firstSmall][kind];\n    return [!P.rem&&!P.zeroQ&&!P.firstSmall, P.rem&&!P.zeroQ&&!P.firstSmall, P.zeroQ&&!P.firstSmall, P.firstSmall][kind];\n  };\n  do{t++;d=r(2,kind===0&&nd<4?4:9);a=r(10**(nd-1),10**nd-1);P=divPlan(a,d)}while(t<20000&&!ok());\n  return {a,b:d,op:'/',s:P.quo,rem:P.rem};\n}\n/* ---------- word problems: 1 → many = ×, many → 1 = ÷ ---------- */\nconst MUL_ST=[\n (p,n)=>`One pen costs ₹${p}. What is the cost of ${n} such pens?`,\n (p,n)=>`One box has ${p} mangoes. How many mangoes are there in ${n} boxes?`,\n (p,n)=>`1 kg of lemons costs ₹${p}. What is the cost of ${n} kg of lemons?`,\n (p,n)=>`${p} people travel in one bus. How many people travel in ${n} buses?`,\n (p,n)=>`One notebook has ${p} pages. How many pages are there in ${n} notebooks?`,\n (p,n)=>`One tree has ${p} fruits. How many fruits are there on ${n} trees?`];\nconst DIV_ST=[\n (t,n)=>`${n} pens cost ₹${t}. What is the cost of one pen?`,\n (t,n)=>`${t} chocolates are shared equally among ${n} children. How many does each child get?`,\n (t,n)=>`${n} kg of lemons cost ₹${t}. What is the cost of 1 kg?`,\n (t,n)=>`${t} mangoes are packed equally in ${n} boxes. How many mangoes are in each box?`,\n (t,n)=>`${n} notebooks have ${t} pages in all. How many pages are in one notebook?`,\n (t,n)=>`${t} students stand equally in ${n} rows. How many students are in each row?`];\nfunction story(k,n){\n  const hard=k>=n/2, p=hard?r(101,399):r(11,99), m=r(2,9), mul=Math.random()<.5;\n  if(mul)return {a:p,b:m,op:'*',s:p*m,story:MUL_ST[r(0,MUL_ST.length-1)](p,m)};\n  return {a:p*m,b:m,op:'/',s:p,rem:0,story:DIV_ST[r(0,DIV_ST.length-1)](p*m,m)};\n}\nfunction drawDiv(){\n  const q=S.qs[S.i],P=S.dp,D=P.D.length,Q=P.steps.length,cols=3+D+Q,g=$('sumGrid');\n  g.classList.remove('sub','mul');g.classList.add('div');\n  g.style.gridTemplateColumns=`repeat(${cols},auto)`;\n  const nk=nextPos(), cur=nk!==null?P.stage[nk]:Q-1;\n  const rows=[];const blank=()=>Array(cols).fill('');\n  const r0=blank();r0[0]=q.b;r0[1]=')';P.D.forEach((x,j)=>r0[2+j]=x);r0[2+D]='(';\n  for(let s=0;s<Q;s++)r0[3+D+s]=s<=cur?box('q'+s,'ans'):'';\n  rows.push([r0,'']);\n  P.steps.forEach((st,s)=>{\n    if(s>cur)return;\n    const last=s===Q-1, pr=blank(), ln=blank(), rr=blank();\n    pr[1+st.start]='−';\n    for(let c=st.start;c<=st.e;c++){pr[2+c]=box('m'+s+'_'+c,'ans');ln[2+c]='<div class=\"uln\"><\/div>'}\n    rr[2+st.e]=box('r'+s,'ans'+(last?' remb':''));\n    if(st.next!==null)rr[3+st.e]=box('n'+s,'ans dn');\n    if(last){rr[2+D]='<span class=\"remlbl\">Rem.<\/span>'}\n    rows.push([pr,''],[ln,' lrow'],[rr,'']);\n  });\n  g.innerHTML=rows.map(([cells,cls])=>cells.map((x,i)=>`<div class=\"cell${cls}${i===1||x==='−'?' opc':''}\">${x}<\/div>`).join('')).join('');\n}\nfunction divSteps(q){\n  const P=divPlan(q.a,q.b);\n  return P.steps.map(st=>`<p>How many ${q.b}s in ${st.cur}? <b>${st.qd}<\/b> (${q.b} × ${st.qd} = ${st.prod}). ${st.cur} − ${st.prod} = ${st.rem}`+(st.next!==null?`. Bring down the next digit ${st.next}.`:st.rem?`. ${st.rem} is the remainder.`:'.')+'<\/p>').join('');\n}\nconst ansTxt=q=>q.op==='n'?namesTxt(q):q.op==='/'&&q.rem?`${q.s} (R ${q.rem})`:`${q.s}`;\nconst RULE={'*':'Value of ONE is given, value of MANY is asked → Multiplication (×)','/':'Value of MANY is given, value of ONE is asked → Division (÷)'};\nfunction drawPick(){\n  const g=$('sumGrid');g.classList.remove('sub','mul','div');g.style.gridTemplateColumns='1fr 1fr';\n  g.innerHTML=`<p class=\"pickq\" style=\"grid-column:1/-1\">Which operation for this sum?<\/p><button class=\"pick\" data-o=\"*\">× Multiplication<\/button><button class=\"pick\" data-o=\"/\">÷ Division<\/button>`;\n  g.querySelectorAll('.pick').forEach(b=>b.onclick=()=>pickOp(b.dataset.o));\n}\nfunction pickOp(o){\n  const q=S.qs[S.i];\n  if(o===q.op){S.needOp=false;$('fb').className='fb ok';$('fb').textContent='✔ '+RULE[q.op];speak('Correct choice. '+RULE[q.op].replace(/\\(.\\)/,''));drawSum()}\n  else{S.opWrong=true;$('fb').className='fb no';$('fb').textContent='✘ '+RULE[q.op];speak('No. '+RULE[q.op].replace(/\\(.\\)/,''))}\n}\n\n/* ---------- పేర్లు (names of the parts of each operation) ---------- */\nconst NAMES={'+':['Addend','Addend','Sum'],'-':['Minuend','Subtrahend','Difference'],'*':['Multiplicand','Multiplier','Product'],'/':['Divisor','Dividend','Quotient','Remainder']};\nconst EN={'Addend':'కూడే సంఖ్య','Sum':'మొత్తం','Minuend':'తీసివేయబడే సంఖ్య','Subtrahend':'తీసివేసే సంఖ్య','Difference':'తేడా','Multiplicand':'గుణ్యం','Multiplier':'గుణకం','Product':'లబ్ధం','Dividend':'భాజ్యం','Divisor':'భాజకం','Quotient':'భాగఫలం','Remainder':'శేషం'};\nconst shuf=a=>{for(let i=a.length-1;i>0;i--){const j=r(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};\nfunction nameQ(kind){\n  let nums;\n  if(kind==='+'){const a=r(11,79),b=r(11,99-a);nums=[a,b,a+b]}\n  else if(kind==='-'){const a=r(30,99),b=r(11,a-10);nums=[a,b,a-b]}\n  else if(kind==='*'){let a,b;do{a=r(12,99);b=r(2,9)}while(a===b);nums=[a,b,a*b]}\n  else{let d,qt,rm,a;do{d=r(2,9);qt=r(2,20);rm=r(0,d-1);a=d*qt+rm}while(new Set([d,qt,rm,a]).size<4);nums=[d,a,qt,rm]}\n  const own=[...new Set(NAMES[kind])], other=shuf(Object.keys(NAMES).filter(k=>k!==kind).flatMap(k=>NAMES[k]).filter(x=>!own.includes(x)));\n  return {op:'n',kind,nums,a:nums[0],b:nums[1],s:1,chips:shuf([...own,...[...new Set(other)].slice(0,3)])};\n}\nconst qTxt=q=>q.op!=='n'?`${q.a} ${OPS[q.op].sym} ${q.b}`:q.kind==='/'?`${q.nums[1]} ÷ ${q.nums[0]} = ${q.nums[2]}, R ${q.nums[3]}`:`${q.nums[0]} ${OPS[q.kind].sym} ${q.nums[1]} = ${q.nums[2]}`;\nconst namesTxt=q=>q.nums.map((n,i)=>`${n} → ${NAMES[q.kind][i]}`).join(', ');\nconst DPOS=['left','middle','right','below'];\nfunction drawNames(){\n  const q=S.qs[S.i],g=$('sumGrid');\n  g.classList.remove('sub','mul','div');g.style.gridTemplateColumns='1fr';\n  const slot=i=>{const k='l'+i,v=S.vals[k],nx=!S.done&&k===nextPos(),st=S.mark?(v===S.exp[k]?' good':' bad'):'';\n    return `<button class=\"lslot${nx?' next':''}${st}\" data-k=\"${k}\">${v||'?'}<\/button>`};\n  let h='';\n  if(q.kind==='/'){\n    const [d,a,qt,rm]=q.nums;\n    h+=`<div class=\"dexp\"><span>${d}<\/span> ) <span>${a}<\/span> ( <span>${qt}<\/span><div class=\"drem\">${rm}<\/div><\/div>`;\n    q.nums.forEach((n,i)=>h+=`<div class=\"nrow\"><span class=\"nnum\">${n}<\/span><small class=\"npos\">(${DPOS[i]})<\/small><span class=\"arr\">→<\/span>${slot(i)}<\/div>`);\n  }else{\n    const ops=['',OPS[q.kind].sym,''];\n    q.nums.forEach((n,i)=>{ if(i===2)h+='<div class=\"nline\"><\/div>';\n      h+=`<div class=\"nrow\"><span class=\"nop\">${ops[i]}<\/span><span class=\"nnum\">${n}<\/span><span class=\"arr\">→<\/span>${slot(i)}<\/div>`});\n  }\n  g.innerHTML=h;\n  g.querySelectorAll('.lslot').forEach(b=>b.onclick=()=>{if(S.done)return;S.vals[b.dataset.k]=null;S.mark=false;drawSum()});\n  $('chips').innerHTML=q.chips.map(c=>`<button class=\"chip\" data-c=\"${c}\">${c}<small>${EN[c]}<\/small><\/button>`).join('');\n  $('chips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{\n    if(S.done)return;const k=nextPos();if(k===null)return;S.vals[k]=b.dataset.c;S.mark=false;$('fb').textContent='';drawSum()});\n}\n\n/* ---------- voice ---------- */\nlet teVoice=null;\nfunction pickVoice(){if(!('speechSynthesis'in window))return;const v=speechSynthesis.getVoices();teVoice=v.find(x=>/en(-|_)?IN/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}\nif('speechSynthesis'in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}\nfunction speak(t){if(!S.voice||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-IN';if(teVoice)u.voice=teVoice;u.rate=.9;speechSynthesis.speak(u)}catch(e){}}\nconst sayQ=q=>q.op==='n'?`Choose the name of each number in this ${OPS[q.kind].title} sum`:q.story?q.story:q.op==='/'?`What is ${q.a} divided by ${q.b}?`:`What is ${q.a} ${OPS[q.op].word} ${q.b}?`;\n\n/* ---------- start screen ---------- */\nfunction setOp(op){\n  OP=op; const o=OPS[op];\n  $('opAdd').setAttribute('aria-pressed',op==='+');$('opSub').setAttribute('aria-pressed',op==='-');$('opMul').setAttribute('aria-pressed',op==='*');$('opDiv').setAttribute('aria-pressed',op==='/');$('opNam').setAttribute('aria-pressed',op==='n');\n  $('bRule').textContent=o.rule?'Remember: '+o.rule:'';$('bRule').hidden=!o.rule;\n  $('bSym').textContent=o.sym;$('bTitle').textContent=o.title;\n  $('bWords').innerHTML=o.words.map(w=>`<span>${w}<\/span>`).join('');\n  const cur=document.querySelector('input[name=lvl]:checked');let v=cur?cur.value:'1';\n  if(!o.lv[v])v='1';\n  $('levels').innerHTML=Object.keys(o.lv).map(l=>`<label class=\"lv\"><input type=\"radio\" name=\"lvl\" value=\"${l}\"${l==v?' checked':''}><span><b>${o.lv[l][0]}<\/b><small>${o.lv[l][1]}<\/small><\/span><\/label>`).join('');\n  save('raay_koodika_op',op);\n}\n$('opAdd').onclick=()=>setOp('+');$('opSub').onclick=()=>setOp('-');$('opMul').onclick=()=>setOp('*');$('opDiv').onclick=()=>setOp('/');$('opNam').onclick=()=>setOp('n');\nfunction esc(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]))}\nfunction renderHist(){\n  const h=load('raay_koodika_hist',[]);const ul=$('histList');\n  if(!h.length){ul.innerHTML='<li class=\"muted\">No results yet. Start your first practice.<\/li>';$('btnClearHist').style.display='none';return}\n  ul.innerHTML=h.slice(0,8).map(x=>`<li><span>${esc(x.name)} (Class ${x.cls}) — ${lvName(x.op,x.lvl)}<\/span><b>${x.score}/${x.total}<\/b><\/li>`).join('');\n  $('btnClearHist').style.display='inline-block';\n}\nfunction readForm(){\n  const name=$('stName').value.trim();\n  if(!name){$('startErr').textContent='Please enter the student name first.';$('stName').focus();return null}\n  $('startErr').textContent='';\n  save('raay_koodika_last',{name,cls:$('stClass').value});\n  return {name,cls:$('stClass').value,op:OP,lvl:+document.querySelector('input[name=lvl]:checked').value,n:+$('qCount').value};\n}\nfunction ask(msg,yes,no){$('mMsg').textContent=msg;$('modal').hidden=false;$('mYes').focus();\n  $('mYes').onclick=()=>{$('modal').hidden=true;yes&&yes()};$('mNo').onclick=()=>{$('modal').hidden=true;no&&no()}}\nfunction show(id){\n  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');window.scrollTo(0,0);\n  if(id!=='sStart'){try{if(!history.state||!history.state.inner)history.pushState({inner:1},'')}catch(e){}}\n}\nfunction goHome(){show('sStart');renderHist();try{if(history.state&&history.state.inner)history.back()}catch(e){}}\nwindow.addEventListener('popstate',()=>{\n  if($('sQuiz').classList.contains('on')){\n    try{history.pushState({inner:1},'')}catch(e){}\n    ask('Stop practice and go Home?',goHome);\n  }else if($('sRes').classList.contains('on')){show('sStart');renderHist()}\n});\ndocument.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('modal').hidden)$('mNo').click()});\n$('btnStart').onclick=()=>{\n  const f=readForm();if(!f)return;\n  S={...S,name:f.name,cls:f.cls,lvl:f.lvl,op:f.op,qs:build(f.op,f.lvl,f.n),i:0,score:0,wrong:[]};\n  $('qWho').textContent=f.name; show('sQuiz'); showQ();\n};\n$('btnSheet').onclick=()=>{const f=readForm();if(!f)return;printSheet(f)};\n$('btnClearHist').onclick=()=>ask('Clear all results?',()=>{save('raay_koodika_hist',[]);renderHist()});\n\n/* ---------- quiz ----------\n slots: 'a'+p = answer digit of column p; 'b'+p+'_'+row = small box above column p\n (addition: carry; subtraction: new top value after borrowing, row 0 nearest the number) */\nfunction showQ(){\n  const q=S.qs[S.i];\n  S.tries=0;S.done=false;S.hintUsed=false;S.mark=false;\n  const L=String(q.s).length, sd=String(q.s).split('').reverse();\n  S.exp={};S.order=[];S.rows=0;\n  const pushA=p=>{if(p<L){S.exp['a'+p]=sd[p];S.order.push('a'+p)}};\n  let note='Write the answer from the ones place (right side)';\n  S.mp=null;S.dp=null;S.needOp=!!q.story;S.opWrong=false;\n  $('pad').hidden=q.op==='n';$('chips').hidden=q.op!=='n';\n  if(q.op==='n'){q.nums.forEach((n,i)=>{S.exp['l'+i]=NAMES[q.kind][i];S.order.push('l'+i)});note='Tap the correct name for each number. To change one, tap its box.'}\n  $('story').hidden=!q.story;$('story').textContent=q.story||'';\n  if(q.op==='n'){}else if(q.op==='/'){\n    const P=divPlan(q.a,q.b);S.dp=P;Object.assign(S.exp,P.exp);S.order=P.order.slice();\n    note='Order: quotient digit → multiply & write below → subtract → bring down the next digit. What is left at the end is the remainder.';\n  }else if(q.op==='*'){\n    const P=mulPlan(q);S.mp=P;Object.assign(S.exp,P.exp);S.order=P.order.slice();\n    note='If the product is 10 or more: first write the tens digit in the small box above, then the ones digit below.'+(P.multi?' From the second row, first write 0; at the end add the rows.':'');\n  }else if(q.op==='+'){\n    if(Math.max(q.a,q.b)<10){for(let p=L-1;p>=0;p--)pushA(p); if(L>1)note='First write the tens place (left), then the ones (right)'}\n    else{\n      const a=rev(q.a),b=rev(q.b);let c=0;\n      for(let p=0;p<L;p++){\n        const s=(a[p]||0)+(b[p]||0)+c;c=s>=10?1:0;\n        if(c&&p+1<L&&(a[p+1]!==undefined||b[p+1]!==undefined)){S.exp['b'+(p+1)+'_0']='1';S.order.push('b'+(p+1)+'_0');S.rows=1}\n        pushA(p);\n      }\n      if(S.rows)note='If the sum is 10 or more: first write the tens digit in the small box above, then the ones digit in the box below';\n    }\n  }else{\n    const sim=subSim(q.a,q.b);\n    sim.steps.forEach(st=>{\n      if(st.borrow){S.exp['t'+st.p]='1';S.order.push('t'+st.p);S.exp['u'+(st.p+1)]='1';S.order.push('u'+(st.p+1))}\n      pushA(st.p);\n    });\n    if(sim.borrows)note='If the top digit is smaller: first write 1 before it, then write 1 in the next place of the bottom number, then write the answer';\n  }\n  S.vals={};S.order.forEach(k=>S.vals[k]=null);\n  $('orderNote').textContent=note;\n  $('qNum').textContent=`Sum ${S.i+1} / ${S.qs.length}`;\n  $('qScore').textContent=`Correct: ${S.score}`;\n  $('qBar').style.width=(S.i/S.qs.length*100)+'%';\n  $('qTag').textContent=tagOf(q);\n  $('fb').textContent='';$('fb').className='fb';\n  $('steps').className='steps';$('steps').innerHTML='';\n  $('btnCheck').textContent='Check';\n  drawSum(); speak(sayQ(q));\n}\nconst full=k=>S.vals[k]!==null&&(k[0]==='l'||S.vals[k].length>=S.exp[k].length);\nfunction nextPos(){const k=S.order.find(x=>!full(x));return k===undefined?null:k}\nfunction box(k,cls){\n  const v=S.vals[k], nx=!S.done&&k===nextPos();\n  const st=S.mark?(v===S.exp[k]?' good':' bad'):'';\n  let extra='';\n  if((k[0]==='t'||k[0]==='u')&&v!==null&&!S.mark)extra+=' filled';\n  return `<div class=\"${cls}${nx?' next':''}${st}${extra}\" data-k=\"${k}\">${v===null?'':v}<\/div>`;\n}\nfunction drawSum(){\n  if(S.needOp){drawPick();return}\n  if(S.qs[S.i].op==='n'){drawNames();return}\n  if(S.qs[S.i].op==='*'){drawMul();return}\n  if(S.qs[S.i].op==='/'){drawDiv();return}\n  $('sumGrid').classList.remove('mul','div');\n  const q=S.qs[S.i], L=String(q.s).length, W=Math.max(L,String(q.a).length,String(q.b).length);\n  const g=$('sumGrid');\n  g.style.gridTemplateColumns=`repeat(${W+1},auto)`;\n  let h='<div class=\"cell place\"><\/div>';\n  for(let c=W-1;c>=0;c--)h+=`<div class=\"cell place\">${PLACE[c]}<\/div>`;\n  for(let row=S.rows-1;row>=0;row--){\n    h+='<div class=\"cell crow\"><\/div>';\n    for(let c=W-1;c>=0;c--){const k='b'+c+'_'+row;h+=`<div class=\"cell crow\">${S.exp[k]?box(k,'cbox'):''}<\/div>`}\n  }\n  g.classList.toggle('sub',q.op==='-');\n  const numRow=(num,op,pre)=>{let o=`<div class=\"cell opc\">${op}<\/div>`;\n    [...String(num).padStart(W,' ')].forEach((ch,i)=>{const c=W-1-i,k=pre+c;o+=`<div class=\"cell\">${S.exp[k]?box(k,'mini'):''}<span class=\"dg\">${ch.trim()}<\/span><\/div>`});return o};\n  h+=numRow(q.a,'','t')+numRow(q.b,OPS[q.op].sym,'u');\n  h+=`<div class=\"line\" style=\"grid-column:1/-1\"><\/div><div class=\"cell\"><\/div>`;\n  for(let k=0;k<W-L;k++)h+='<div class=\"cell\"><\/div>';\n  for(let p=L-1;p>=0;p--)h+=`<div class=\"cell\">${box('a'+p,'ans')}<\/div>`;\n  g.innerHTML=h;\n}\nfunction markBoxes(){S.mark=true;drawSum()}\nfunction press(n){\n  if(S.done||S.needOp||S.qs[S.i].op==='n')return;const k=nextPos();if(k===null)return;\n  S.mark=false;S.vals[k]=(S.vals[k]||'')+n;$('fb').textContent='';drawSum();\n}\nfunction del(){\n  if(S.done)return;\n  for(let j=S.order.length-1;j>=0;j--){const k=S.order[j];if(S.vals[k]!==null){S.vals[k]=k[0]!=='l'&&S.vals[k].length>1?S.vals[k].slice(0,-1):null;break}}\n  S.mark=false;drawSum();\n}\nfunction stepsHTML(q){\n  let out='';\n  if(q.op==='n')return `<p>Names in this sum: <b>${[...new Set(NAMES[q.kind])].join(', ')}<\/b><\/p><p class=\"tot\"><b>Correct names: ${namesTxt(q)}<\/b><\/p>`;\n  if(q.story)out=`<p><b>${RULE[q.op]}<\/b><\/p>`;\n  if(q.op==='/'){out+=divSteps(q)}\n  else if(q.op==='*'){out+=mulSteps(q)}\n  else if(q.op==='+'){\n    const a=rev(q.a),b=rev(q.b),W=Math.max(a.length,b.length);let c=0;\n    for(let p=0;p<W;p++){\n      const x=a[p]||0,y=b[p]||0,s=x+y+c;\n      let t=`<b>${PLACEFULL[p]}:<\/b> ${x} + ${y}${c?' + '+c+' (carried)':''} = ${s}`;\n      t+=(s>=10&&p<W-1)?` → write ${Math.floor(s/10)} above the ${PLACEFULL[p+1]} and ${s%10} below`:` → write ${s}`;\n      out+=`<p>${t}<\/p>`;c=s>=10?1:0;\n    }\n  }else{\n    const sim=subSim(q.a,q.b), L=String(q.s).length;\n    sim.steps.forEach(st=>{\n      let t=`<b>${PLACEFULL[st.p]}:<\/b> `;\n      const ys=st.pay?`(${st.y} + 1)`:`${st.y}`;\n      if(st.borrow)t+=`${st.x0} − ${ys} is not possible. Write 1 before ${st.x0} → ${st.x}. Write 1 in the ${PLACEFULL[st.p+1]} place of the bottom number. `;\n      t+=`${st.x} − ${ys} = ${st.d}`;\n      if(st.p>=L)t+=' (no need to write a leading zero)';\n      out+=`<p>${t}<\/p>`;\n    });\n  }\n  return out+`<p class=\"tot\"><b>${OPS[q.op].res} = ${ansTxt(q)}<\/b><\/p>`;\n}\nfunction check(){\n  if(S.done){next();return}\n  if(S.needOp){$('fb').className='fb no';$('fb').textContent='First choose × or ÷';return}\n  if(S.order.some(k=>!full(k))){$('fb').className='fb no';$('fb').textContent='Fill all the boxes';return}\n  const q=S.qs[S.i],L=String(q.s).length;\n  let gs='';\n  if(q.op==='/'){for(let s=0;s<S.dp.steps.length;s++)gs+=S.vals['q'+s]}else for(let p=L-1;p>=0;p--)gs+=S.vals['a'+p];\n  let got=+gs;const ansKey=q.op==='/'?'q':q.op==='n'?'l':'a';\n  if(q.op==='n')got=S.order.every(k=>S.vals[k]===S.exp[k])?q.s:-1;\n  const boxOk=S.order.every(k=>k[0]===ansKey||S.vals[k]===S.exp[k]);\n  S.tries++;\n  const nxt=S.i<S.qs.length-1?'Next sum':'See result';\n  if(got===q.s&&boxOk){\n    if(S.tries===1&&!S.hintUsed&&!S.opWrong)S.score++;\n    S.done=true;markBoxes();\n    const pr=['Great!','Very good!','Well done!','Correct!'][r(0,3)];\n    $('fb').className='fb ok';$('fb').textContent=q.op==='n'?`✔ ${pr} All names are correct`:`✔ ${pr} ${q.a} ${OPS[q.op].sym} ${q.b} = ${ansTxt(q)}`;\n    speak(q.op==='n'?`${pr} All names are correct`:`${pr} ${q.a} ${OPS[q.op].word} ${q.b} equals ${q.s}`+(q.rem?`, remainder ${q.rem}`:''));\n    if(S.tries>1||S.hintUsed||S.opWrong)S.wrong.push({q,got:S.firstGot});\n    $('btnCheck').textContent=nxt;\n  }else if(S.tries===1){\n    S.firstGot=got;markBoxes();\n    const msg=got===q.s?(q.op==='/'?'✘ A multiplied / subtracted / brought-down digit is wrong. Try again':q.op==='*'?'✘ A digit in the top/middle boxes is wrong. Try again':q.op==='+'?'✘ The carried digit is wrong. Try again':'✘ The 1s in the small boxes are wrong. Try again'):'✘ Not correct. Try again';\n    $('fb').className='fb no';$('fb').textContent=msg;speak(msg.replace('✘ ',''));\n    setTimeout(()=>{if(!S.done){S.order.forEach(k=>S.vals[k]=null);S.mark=false;drawSum()}},1200);\n  }else{\n    S.done=true;markBoxes();S.wrong.push({q,got:S.firstGot});\n    $('fb').className='fb no';$('fb').textContent=`Correct answer: ${ansTxt(q)}`;\n    $('steps').innerHTML=stepsHTML(q);$('steps').className='steps on';\n    speak(`The correct answer is ${q.s}`);$('btnCheck').textContent=nxt;\n  }\n}\nfunction next(){S.i++;if(S.i>=S.qs.length)finish();else showQ()}\nfunction hint(){S.hintUsed=true;$('steps').innerHTML=stepsHTML(S.qs[S.i]).replace(/<p class=\"tot\">.*$/,'');$('steps').className='steps on'}\n\n(function(){const p=$('pad');for(const n of [1,2,3,4,5,6,7,8,9,0]){const b=document.createElement('button');b.textContent=n;b.onclick=()=>press(n);p.appendChild(b)}})();\n$('btnDel').onclick=del;$('btnCheck').onclick=check;$('btnHint').onclick=hint;\n$('btnSay').onclick=()=>{const v=S.voice;S.voice=true;speak(sayQ(S.qs[S.i]));S.voice=v};\n$('btnVoice').onclick=()=>{S.voice=!S.voice;$('btnVoice').textContent=S.voice?'🔊':'🔇';if(!S.voice&&'speechSynthesis'in window)speechSynthesis.cancel()};\n$('btnHome').onclick=()=>ask('Stop practice and go Home?',goHome);\ndocument.addEventListener('keydown',e=>{\n  if(!$('sQuiz').classList.contains('on')||!$('modal').hidden)return;\n  if(/^[0-9]$/.test(e.key))press(e.key);\n  else if(e.key==='Backspace'){e.preventDefault();del()}\n  else if(e.key==='Enter'){e.preventDefault();check()}\n});\n\n/* ---------- result ---------- */\nfunction finish(){\n  const t=S.qs.length,sc=S.score,pc=Math.round(sc/t*100);\n  $('rName').textContent=S.name;\n  $('rInfo').textContent=`Class ${S.cls} — ${lvName(S.op,S.lvl)} — ${new Date().toLocaleDateString('en-IN')}`;\n  $('rScore').textContent=`${sc}/${t}`;\n  const st=pc>=90?5:pc>=75?4:pc>=60?3:pc>=40?2:1;\n  $('rStars').textContent='★'.repeat(st)+'☆'.repeat(5-st);\n  const msg=pc>=90?`Excellent! You are an expert in ${OPS[S.op].title}.`:pc>=75?'Very good! Practise a little more.':pc>=50?'Good. Look at your mistakes again and learn.':'Practise every day and you will surely get it!';\n  $('rMsg').textContent=msg;\n  $('revCard').style.display=S.wrong.length?'block':'none';\n  $('revBody').innerHTML=S.wrong.map(w=>`<tr><td>${qTxt(w.q)}<\/td><td style=\"color:#C0392B\">${w.q.op==='n'?'wrong names':w.got??'-'}<\/td><td style=\"color:#2E8B4E;font-weight:700\">${ansTxt(w.q)}<\/td><\/tr>`).join('');\n  const h=load('raay_koodika_hist',[]);h.unshift({name:S.name,cls:S.cls,op:S.op,lvl:S.lvl,score:sc,total:t,d:Date.now()});save('raay_koodika_hist',h.slice(0,50));\n  show('sRes');speak(`${S.name}, you got ${sc} out of ${t}. ${msg}`);\n}\n$('btnAgain').onclick=()=>{S.qs=build(S.op,S.lvl,S.qs.length);S.i=0;S.score=0;S.wrong=[];show('sQuiz');showQ()};\n$('btnHome2').onclick=goHome;\n$('btnPrintRes').onclick=()=>{\n  const rows=S.wrong.map(w=>`<tr><td>${qTxt(w.q)}<\/td><td>${w.q.op==='n'?'wrong names':w.got??'-'}<\/td><td>${ansTxt(w.q)}<\/td><\/tr>`).join('');\n  $('printArea').innerHTML=`<div class=\"ph\"><h2>${OPS[S.op].title} — Result<\/h2><div class=\"fl\"><span>Name: <b>${esc(S.name)}<\/b><\/span><span>Class: ${S.cls}<\/span><span>Level: ${lvName(S.op,S.lvl)}<\/span><span>Date: ${new Date().toLocaleDateString('en-IN')}<\/span><\/div><\/div>\n  <p style=\"font-size:22px\">Marks: <b>${S.score} / ${S.qs.length}<\/b> &nbsp; ${$('rStars').textContent}<\/p><p>${$('rMsg').textContent}<\/p>\n  ${rows?`<h3>Mistakes<\/h3><table border=\"1\" cellpadding=\"6\" style=\"border-collapse:collapse;min-width:60%\"><tr><th>Sum<\/th><th>Written<\/th><th>Correct answer<\/th><\/tr>${rows}<\/table>`:''}\n  <div class=\"pft\">Teacher's signature: ____________ &nbsp;&nbsp; | రాయ్ ఎడ్యుకేషన్<\/div>`;\n  window.print();\n};\n\n/* ---------- worksheet ---------- */\nfunction printSheet(f){\n  const qs=build(f.op,f.lvl,f.n),dt=new Date().toLocaleDateString('en-IN'),o=OPS[f.op];\n  const cell=(q,k,key)=>q.op==='n'?`<div class=\"pst\"><b>${k+1})<\/b> ${qTxt(q)}<br>${q.nums.map((n,i)=>`${n} → ${key?NAMES[q.kind][i]:'__________'}`).join(' &nbsp; ')}<\/div>`\n    :q.story?`<div class=\"pst\"><b>${k+1})<\/b> ${q.story}<br>${key?'Answer: '+q.a+' '+OPS[q.op].sym+' '+q.b+' = '+ansTxt(q):'Operation: ____ &nbsp; Answer: ________'}<\/div>`\n    :q.op==='/'?`<div class=\"pq\"><span class=\"n\">${k+1})<\/span><div class=\"dvp\">${q.b} ) ${q.a} ( ${key?ansTxt(q):'&nbsp;'.repeat(8)}<\/div><\/div>`\n    :`<div class=\"pq${f.op==='-'?' sub':''}\"><span class=\"n\">${k+1})<\/span><div class=\"col\"><div>${q.a}<\/div><div class=\"u\">${o.sym} ${q.b}<\/div><div class=\"bx\">${key?q.s:''}<\/div><\/div><\/div>`;\n  const head=`<div class=\"ph\"><h2>${o.title} — Worksheet (${lvName(f.op,f.lvl)})<\/h2><div class=\"fl\"><span>Name: <b>${esc(f.name)}<\/b><\/span><span>Class: ${f.cls}<\/span><span>Date: ${dt}<\/span><span>Marks: ____ / ${qs.length}<\/span><\/div><\/div>`;\n  $('printArea').innerHTML=head+`<p style=\"margin:0 0 10px\">${f.lvl==5?'Read each problem, choose × or ÷ and solve':{'+':'Add','-':'Subtract','*':'Multiply','/':'Divide','n':'Write the name of each number'}[f.op]}. (Easy to difficult)<\/p><div class=\"pgrid\">${qs.map((q,k)=>cell(q,k,false)).join('')}<\/div>\n  <div class=\"pft\">రాయ్ ఎడ్యుకేషన్<\/div>\n  <div class=\"pkey\"><div class=\"ph\"><h2>Answers — ${esc(f.name)}<\/h2><\/div><div class=\"pgrid\">${qs.map((q,k)=>cell(q,k,true)).join('')}<\/div><\/div>`;\n  window.print();\n}\n\n/* init */\nconst last=load('raay_koodika_last',null);\nif(last){$('stName').value=last.name||'';if(last.cls)$('stClass').value=last.cls}\n{const o=load('raay_koodika_op','+');setOp(OPS[o]?o:'+')}\nrenderHist();\n})();\n\n<\/script>\n<\/body>\n<\/html>"};
function open(l){if(!PAGES[l])l='te';try{localStorage.setItem('raay_lang',l)}catch(e){}
  if('speechSynthesis'in window)try{speechSynthesis.cancel()}catch(e){}
  document.open();document.write(PAGES[l]);document.close();}
window.raayLang=open;
let l='te';try{l=localStorage.getItem('raay_lang')||'te'}catch(e){}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>open(l));else open(l);
})();
